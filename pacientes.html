<div class="container-fluid mt-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><i class="bi bi-house"></i> INÍCIO</li>
        <li class="breadcrumb-item active">PACIENTES</li>
      </ol>
    </nav>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-secondary btn-sm" onclick="carregarPacientes(paginaAtualPacientes)" title="Atualizar Lista">
        <i class="bi bi-arrow-clockwise"></i>
      </button>
      <button class="btn btn-info text-white btn-sm" onclick="carregarConteudo('cadastro_pacientes.html')">
        <i class="bi bi-plus-lg"></i> Novo
      </button>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0" style="font-size: 0.85rem;">
        <thead class="table-light">
          <tr>
            <th width="80">Ações</th>
            <th>Nome ou Código</th>
            <th>CPF</th>
            <th>Celular</th>
            <th>Data Nascimento</th>
          </tr>
          <tr class="bg-light">
            <td></td>
            <td>
              <input type="text" id="f_nome" class="form-control form-control-sm" 
                     placeholder="Filtrar Nome... + Enter" 
                     onkeyup="if(event.key==='Enter') carregarPacientes(0)">
            </td>
            <td>
              <input type="text" id="f_cpf" class="form-control form-control-sm" 
                     placeholder="CPF + Enter" 
                     onkeyup="if(event.key==='Enter') carregarPacientes(0)">
            </td>
            <td>
              <input type="text" id="f_celular" class="form-control form-control-sm" 
                     placeholder="Celular + Enter" 
                     onkeyup="if(event.key==='Enter') carregarPacientes(0)">
            </td>
            <td><input type="text" class="form-control form-control-sm" disabled></td>
          </tr>
        </thead>
        <tbody id="corpoTabelaPacientes">
          <tr><td colspan="5" class="text-center p-4"><div class="spinner-border spinner-border-sm text-info"></div> Carregando lista...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="card-footer bg-white d-flex justify-content-between align-items-center">
      <small id="infoPaginacao" class="text-muted"></small>
      <div id="controlesPaginacao"></div>
    </div>
  </div>
</div>




<script>


  // Proteção para não declarar a variável duas vezes ao alternar menus
  if (typeof paginaAtualPacientes === 'undefined') {
    window.paginaAtualPacientes = 0;
  } else {
    paginaAtualPacientes = 0; // Reseta para a primeira página ao voltar
  }

  
  //let paginaAtualPacientes = 0;

  async function carregarPacientes(pagina) {
    paginaAtualPacientes = pagina;
    const corpo = document.getElementById('corpoTabelaPacientes');
    if (!corpo) return;

    corpo.innerHTML = '<tr><td colspan="5" class="text-center p-4"><div class="spinner-border text-info"></div></td></tr>';

    const nome = document.getElementById('f_nome')?.value || "";
    const cpf = document.getElementById('f_cpf')?.value || "";
    const celular = document.getElementById('f_celular')?.value || "";

    try {
      // Chamada para a nova API na Vercel
      const url = `/api/pacientes?pagina=${pagina}&nome=${nome}&documento=${cpf}&celular=${celular}`;
      const resp = await fetch(url);
      const res = await resp.json();

      if (res.sucesso) {
        renderizarTabelaPacientes(res.dados);
        renderizarPaginacaoPacientes(res);
      }
    } catch (err) {
      corpo.innerHTML = '<tr><td colspan="5" class="text-center text-danger">Erro ao conectar com a API.</td></tr>';
    }
  }

  function formatarDataBR(dataIso) {
    if (!dataIso || dataIso === "NULL" || dataIso === "-") return "-";
    const soData = dataIso.split('T')[0];
    const partes = soData.split('-');
    return partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : dataIso;
  }

  function renderizarTabelaPacientes(lista) {
    const corpo = document.getElementById('corpoTabelaPacientes');
    if (!corpo) return;

    if (lista.length === 0) {
      corpo.innerHTML = '<tr><td colspan="5" class="text-center p-4">Nenhum paciente encontrado.</td></tr>';
      return;
    }

    corpo.innerHTML = lista.map(p => `
      <tr>
        <td><button class="btn btn-outline-info btn-sm" onclick="abrirEdicaoPaciente(${p.pcod})" title="Editar"><i class="bi bi-pencil-square"></i></button></td>
        <td><span class="fw-bold">${p.pcod} - ${p.Nome || ""}</span></td>
        <td>${p.Documento || "-"}</td>
        <td>${p.Celular || p.Telefone || "-"}</td>
        <td>${formatarDataBR(p.Data_Nascimento || p["DATA NASC#"] || "-")}</td>
      </tr>
    `).join('');
  }

function renderizarPaginacaoPacientes(res) {
  const info = document.getElementById('infoPaginacao');
  if (info) info.innerText = `Total: ${res.total} registros | Página ${paginaAtualPacientes + 1} de ${res.paginas}`;
  
  const ctrl = document.getElementById('controlesPaginacao');
  if (ctrl) {
    ctrl.innerHTML = `
      <button class="btn btn-sm btn-light border me-1" ${paginaAtualPacientes === 0 ? 'disabled' : ''} 
        onclick="carregarPacientes(${paginaAtualPacientes - 1})">Anterior</button>
      
      <button class="btn btn-sm btn-light border" ${paginaAtualPacientes + 1 >= res.paginas ? 'disabled' : ''} 
        onclick="carregarPacientes(${paginaAtualPacientes + 1})">Próximo</button>
    `;
  }
}

async function abrirEdicaoPaciente(pcod) {
    // 1. Muda o título para sabermos que é edição
    const titulo = document.getElementById('titulo-topo');
    if (titulo) titulo.innerText = "EDITAR PACIENTE: " + pcod;

    // 2. Carrega a tela de cadastro
    await carregarConteudo('cadastro_pacientes.html');

    try {
      // 3. Busca os dados do paciente na API
      const resp = await fetch(`/api/pacientes?pcod=${pcod}`);
      const res = await resp.json();
      
      if (!res.sucesso || !res.paciente) return;
      const paciente = res.paciente;

      // 4. Pequeno intervalo para o navegador renderizar o formulário novo
      setTimeout(() => {
        const form = document.getElementById('formCadastro');
        if (!form) return;

        // Preenche cada campo do formulário com os dados do banco
        Object.keys(paciente).forEach(key => {
          const nomeCampo = (key === 'UF') ? 'Estado' : key;
          const campo = form.querySelector(`[name="${nomeCampo}"]`);
          
          if (campo) {
            if (campo.type === 'date' && paciente[key]) {
              campo.value = paciente[key].split('T')[0];
            } else {
              campo.value = paciente[key] || "";
            }
          }
        });
        
        // Se houver função de carregar convênios na outra página, ela será disparada lá
        if (typeof carregarConvenios === 'function') {
          carregarConvenios(paciente.Convenio);
        }
      }, 300); // 300ms é o tempo ideal para o DOM estar pronto
    } catch (err) {
      console.error("Erro ao carregar paciente:", err);
      Swal.fire('Erro', 'Não foi possível carregar os dados do paciente.', 'error');
    }
  }
  

  carregarPacientes(0);
</script>
