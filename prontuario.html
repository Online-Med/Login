<!-- prontuario.html — fragmento carregado via carregarConteudo() -->
<style>
#prontWrap { animation: fadeIn .18s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }

#prontHeader {
  background: linear-gradient(135deg,#0f6e56,#1d9e75);
  color:#fff; padding:8px 16px;
  display:flex; flex-wrap:wrap; gap:10px; align-items:center;
}
#prontHeader h5 { margin:0; font-size:.95rem; font-weight:700; }

#prontPacPanel {
  background:#fff; border-bottom:2px solid #e9ecef;
  padding:10px 16px; display:flex; gap:14px; align-items:center;
}
#prontFoto { width:60px; height:60px; border-radius:50%; background:#e9ecef; display:flex; align-items:center; justify-content:center; font-size:1.5rem; color:#6c757d; flex-shrink:0; }
#prontFoto img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.pac-dado-pr { font-size:.78rem; }
.pac-dado-pr strong { display:block; font-size:.88rem; color:#212529; }
.pac-dado-pr span { color:#6c757d; }
.pac-pcod-pr { background:#0f6e56; color:#fff; border-radius:20px; padding:2px 10px; font-size:.72rem; font-weight:700; }

/* Linha resumo da consulta */
.pront-card { background:#fff; border-radius:8px; border:1px solid #e9ecef; margin-bottom:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.pront-card-hd { padding:10px 14px; cursor:pointer; display:flex; align-items:center; gap:10px; }
.pront-card-hd:hover { background:#f8f9fb; }
.pront-date { background:#e3f2fd; color:#0c447c; border-radius:8px; padding:4px 10px; font-size:.78rem; font-weight:700; white-space:nowrap; }
.pront-tipo-badge { border-radius:20px; padding:2px 9px; font-size:.68rem; font-weight:600; border:1px solid currentColor; }
.pront-card-body { display:none; border-top:1px solid #f0f0f0; }
.pront-card-body.aberto { display:block; }

/* Resumo inline (sempre visível no card) */
.pront-resumo { font-size:.8rem; color:#495057; flex-grow:1; min-width:0; }
.pront-resumo .r-texto { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pront-resumo .r-tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:2px; }
.pront-tag { display:inline-flex; align-items:center; gap:3px; font-size:.68rem; border-radius:4px; padding:1px 6px; }

/* Detalhe expandido */
.bloco-pr { background:#f9fafb; border-radius:6px; border-left:3px solid #dee2e6; margin-bottom:8px; padding:8px 12px; }
.bloco-pr-hd { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#6c757d; margin-bottom:4px; display:flex; align-items:center; gap:5px; }
.bloco-pr-corpo { font-size:.83rem; color:#212529; white-space:pre-wrap; }
.comp-badge { display:inline-flex; align-items:center; gap:3px; background:#fff; border:1px solid #dee2e6; border-radius:6px; padding:2px 8px; font-size:.75rem; margin:2px; }
.presc-row-pr { background:#f0f4ff; border-radius:6px; padding:5px 10px; margin-bottom:5px; font-size:.82rem; }
.exame-row-pr { background:#fff8e1; border-radius:6px; padding:5px 10px; margin-bottom:5px; font-size:.82rem; }
.medico-pr { font-size:.75rem; color:#6c757d; }
</style>

<div id="prontWrap">

<!-- ── HEADER ──────────────────────────────────────────────────── -->
<div id="prontHeader">
  <button class="btn btn-sm btn-outline-light" onclick="prontVoltar()">
    <i class="bi bi-arrow-left"></i> <span id="prontBtnLabel">Voltar</span>
  </button>
  <h5><i class="bi bi-journal-medical"></i> Prontuário</h5>
  <div class="ms-auto d-flex align-items-center gap-2">
    <span id="prontTotalConsultas" class="badge bg-white text-success" style="font-size:.75rem"></span>
  </div>
</div>

<!-- ── BUSCA ─────────────────────────────────────────────────────── -->
<div id="prontBuscaBar" style="background:#fff;border-bottom:1px solid #e9ecef;padding:10px 16px;display:flex;gap:8px;align-items:center">
  <i class="bi bi-search text-muted"></i>
  <div style="position:relative;max-width:400px;flex:1">
    <input type="text" class="form-control form-control-sm" id="prontBuscaInput"
           placeholder="Nome ou PCOD do paciente..."
           onkeydown="if(event.key==='Enter') prontBuscar()" autocomplete="off">
    <div id="prontDropdown" style="position:absolute;z-index:1080;background:#fff;border:1px solid #dee2e6;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);max-height:220px;overflow-y:auto;min-width:100%;display:none;top:100%;left:0"></div>
  </div>
  <button class="btn btn-info btn-sm text-white" onclick="prontBuscar()">
    <i class="bi bi-search"></i> Buscar
  </button>
</div>

<!-- ── PAINEL DO PACIENTE ─────────────────────────────────────── -->
<div id="prontPacPanel" class="d-none">
  <div id="prontFoto"><i class="bi bi-person"></i></div>
  <div class="flex-grow-1">
    <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
      <strong id="prontPacNome" style="font-size:.95rem">—</strong>
      <span class="pac-pcod-pr" id="prontPacPcod">PCOD —</span>
    </div>
    <div class="d-flex flex-wrap gap-3">
      <div class="pac-dado-pr"><span>Idade</span><strong id="prontPacIdade">—</strong></div>
      <div class="pac-dado-pr"><span>CPF</span><strong id="prontPacCPF">—</strong></div>
      <div class="pac-dado-pr"><span>Celular</span><strong id="prontPacCel">—</strong></div>
      <div class="pac-dado-pr"><span>Convênio</span><strong id="prontPacConv">—</strong></div>
    </div>
  </div>
</div>

<!-- ── CONTEÚDO PRINCIPAL ─────────────────────────────────────── -->
<div class="container-fluid p-3">
  <div id="prontEstadoInicial" class="text-center text-muted py-5">
    <i class="bi bi-journal-medical fs-1 d-block mb-2 opacity-25"></i>
    Busque um paciente para ver o prontuário
  </div>
  <div id="prontSpinner" class="text-center py-5 d-none">
    <div class="spinner-border text-info me-2"></div> Carregando consultas...
  </div>
  <div id="prontSemConsultas" class="text-center text-muted py-5 d-none">
    <i class="bi bi-calendar-x fs-1 d-block mb-2 opacity-25"></i>
    Nenhuma consulta encerrada encontrada para este paciente.
  </div>
  <div id="prontLista"></div>
</div>

</div><!-- /prontWrap -->

<script>
(function(){

var PRONT = { pcod:null, retorno:null, pac:null, consultas:[] };

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

window.prontVoltar = function() {
  var ret = PRONT.retorno || window._prontuarioRetorno || null;
  window._prontuarioPcod = null; window._prontuarioRetorno = null;
  if(typeof carregarConteudo === 'function') carregarConteudo(ret || 'agenda.html');
  else window.history.back();
};

/* ── Busca autocomplete (CORRIGIDO PARA CPF) ─────────────────── */
var _bTmr = null;
document.getElementById('prontBuscaInput').addEventListener('input', function(){
  var v = this.value.trim();
  var dd = document.getElementById('prontDropdown');
  
  if(_bTmr) clearTimeout(_bTmr);
  if(v.length < 2){ dd.style.display='none'; return; }
  
  _bTmr = setTimeout(async function(){
    try {
      // ── AJUSTE AQUI ──
      // Criamos uma variável que remove pontos e traços. 
      // Assim, se o usuário digitar "263659", a API recebe isso limpo.
      var termoBusca = v.replace(/\D/g, '').length > 5 ? v.replace(/\D/g, '') : v;

      var r = await fetch('/api/atestados?action=buscar_paciente&termo='+encodeURIComponent(termoBusca));
      var lista = await r.json();
      
      if(!Array.isArray(lista)||!lista.length){ dd.style.display='none'; return; }
      
      dd.innerHTML = lista.map(function(p){
        return '<div style="padding:8px 12px;cursor:pointer;border-bottom:1px solid #f5f5f5;font-size:.83rem" '
          +'onmouseover="this.style.background=\'#f0f4ff\'" onmouseout="this.style.background=\'\'" '
          +'onclick="prontSelecionarPac('+p.pcod+')">'
          +'<strong>'+esc(p.Nome||'')+'</strong>'
          +(p.Documento?' <span style="color:#6c757d;font-size:.73rem">'+esc(p.Documento)+'</span>':'')
          +'<br><span style="color:#adb5bd;font-size:.72rem">PCOD '+p.pcod+'</span>'
          +'</div>';
      }).join('');
      dd.style.display = 'block';
    } catch(e){}
  }, 350);
});

  
document.addEventListener('click', function(e){
  var dd = document.getElementById('prontDropdown');
  var inp = document.getElementById('prontBuscaInput');
  if(dd && inp && !dd.contains(e.target) && e.target !== inp) dd.style.display='none';
});

window.prontBuscar = async function() {
  var input = document.getElementById('prontBuscaInput').value.trim();
  if(!input) return;

  // 1. Tenta limpar pontos e traços para ver se é um número (CPF ou PCOD)
  var apenasNumeros = input.replace(/\D/g, ''); 

  // Se for apenas números e tiver tamanho de PCOD ou CPF, tentamos a busca direta
  if (apenasNumeros.length > 0 && !isNaN(apenasNumeros)) {
      // Se for um PCOD pequeno ou CPF completo, usamos o valor limpo
      prontSelecionarPac(apenasNumeros); 
      return; 
  }

  try {
    // Para busca por nome, enviamos o texto normal
    var r = await fetch('/api/atestados?action=buscar_paciente&termo='+encodeURIComponent(input));
    var lista = await r.json();
    if(Array.isArray(lista) && lista.length) {
        prontSelecionarPac(lista[0].pcod);
    } else {
        Swal.fire({icon:'info', title:'Não encontrado', text:'Paciente não localizado com este termo.', confirmButtonColor:'#0dcaf0'});
    }
  } catch(e){
      console.error("Erro na busca:", e);
  }
};

window.prontSelecionarPac = async function(pcod) {
  document.getElementById('prontDropdown').style.display='none';
  PRONT.pcod = pcod;
  await _carregarProntuario(pcod);
};

/* ── Carregar prontuário ─────────────────────────────────────── */
async function _carregarProntuario(pcod) {
  document.getElementById('prontEstadoInicial').classList.add('d-none');
  document.getElementById('prontSemConsultas').classList.add('d-none');
  document.getElementById('prontLista').innerHTML = '';
  document.getElementById('prontSpinner').classList.remove('d-none');

  try {
    // Paciente
    var rp = await fetch('/api/atestados?action=buscar_paciente&termo='+encodeURIComponent(String(pcod)));
    var dpList = await rp.json();
    var pac = Array.isArray(dpList) ? dpList.find(function(p){ return p.pcod==pcod; }) || dpList[0] : null;
    PRONT.pac = pac;
    _preencherPainelPac(pac, pcod);

    // Consultas
    var rc = await fetch('/api/atendimento?action=historico&paciente_id='+pcod);
    PRONT.consultas = await rc.json();
    if(!Array.isArray(PRONT.consultas)) PRONT.consultas = [];
  } catch(e){ PRONT.consultas = []; }

  document.getElementById('prontSpinner').classList.add('d-none');

  if(!PRONT.consultas.length) {
    document.getElementById('prontSemConsultas').classList.remove('d-none');
    return;
  }
  document.getElementById('prontTotalConsultas').textContent = PRONT.consultas.length + ' consulta(s)';
  _renderConsultas(PRONT.consultas);
}

function _preencherPainelPac(pac, pcod) {
  document.getElementById('prontPacPanel').classList.remove('d-none');
  document.getElementById('prontPacPcod').textContent = 'PCOD ' + pcod;
  if(!pac) { document.getElementById('prontPacNome').textContent = 'Paciente #'+pcod; return; }
  document.getElementById('prontPacNome').textContent = pac.Nome || '—';
  document.getElementById('prontPacCPF').textContent  = pac.Documento || '—';
  document.getElementById('prontPacCel').textContent  = pac.Celular || pac.Telefone || '—';
  document.getElementById('prontPacConv').textContent = pac.Convenio || pac.Convenio || '—';
  if(pac.Data_Nascimento) {
    var nasc = new Date(pac.Data_Nascimento+'T12:00:00');
    var hoje = new Date();
    var idade = hoje.getFullYear() - nasc.getFullYear();
    if(hoje < new Date(hoje.getFullYear(), nasc.getMonth(), nasc.getDate())) idade--;
    document.getElementById('prontPacIdade').textContent = idade + ' anos';
  }
}

/* ── Renderizar consultas ─────────────────────────────────────── */
function _renderConsultas(lista) {
  var ordenadas = lista.slice().sort(function(a,b){
    return new Date(b.data_atendimento||b.hora_inicio) - new Date(a.data_atendimento||a.hora_inicio);
  });

  var container = document.getElementById('prontLista');
  container.innerHTML = '';

  ordenadas.forEach(function(c, i){
    var dt = c.data_atendimento ? c.data_atendimento.split('-').reverse().join('/') : '—';
    var horaIni = c.hora_inicio ? new Date(c.hora_inicio).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '';
    var horaFim = c.hora_fim   ? new Date(c.hora_fim).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '';
    var duracao = '';
    if(c.hora_inicio && c.hora_fim) {
      var diff = Math.floor((new Date(c.hora_fim)-new Date(c.hora_inicio))/60000);
      duracao = diff + ' min';
    }

    // ── RESUMO: extrai linha de resumo dos blocos ──────────────
    var resumoTexto = _extrairResumo(c);

    // ── TAGS rápidas ──────────────────────────────────────────
    var tags = '';
    if(c.prescricoes && c.prescricoes.length) {
      tags += '<span class="pront-tag" style="background:#e8f0ff;color:#0d6efd">💊 '+c.prescricoes.length+' rx</span>';
    }
    if(c.exames_solicitados && c.exames_solicitados.length) {
      var labs = c.exames_solicitados.filter(function(e){ return (e.subtipo||'LAB')==='LAB'; }).length;
      var imgs = c.exames_solicitados.filter(function(e){ return e.subtipo==='IMG'; }).length;
      if(labs) tags += '<span class="pront-tag" style="background:#e3f2fd;color:#0c447c">🔬 '+labs+' lab</span>';
      if(imgs) tags += '<span class="pront-tag" style="background:#fff3cd;color:#6c3700">🖼 '+imgs+' img</span>';
    }

    var div = document.createElement('div');
    div.className = 'pront-card';
    div.innerHTML =
      // ── CABEÇALHO (resumo, sempre visível) ──
      '<div class="pront-card-hd" onclick="prontToggle('+i+')" id="prontHd-'+i+'">'
        + '<i class="bi bi-chevron-right text-muted" id="prontChev-'+i+'" style="font-size:.85rem;flex-shrink:0"></i>'
        + '<span class="pront-date"><i class="bi bi-calendar3"></i> '+dt+'</span>'
        + (horaIni?'<span class="text-muted" style="font-size:.75rem;white-space:nowrap">'+horaIni+(horaFim?' – '+horaFim:'')+(duracao?' ('+duracao+')':'')+'</span>':'')
        + '<div class="pront-resumo">'
          + '<div class="r-texto">'
            + (c.tipo_consulta_nome?'<span class="pront-tipo-badge me-2" style="background:#f0e6ff;color:#6f42c1;border-color:#6f42c1">'+esc(c.tipo_consulta_nome)+'</span>':'')
            + '<span>'+esc(resumoTexto)+'</span>'
          + '</div>'
          + (tags?'<div class="r-tags">'+tags+'</div>':'')
        + '</div>'
        + (c.medico_inicio_nome?'<span class="medico-pr text-end" style="white-space:nowrap"><i class="bi bi-person-badge"></i> '+esc(c.medico_inicio_nome.split(' ').slice(0,2).join(' '))+'</span>':'')
      + '</div>'

      // ── CORPO EXPANDIDO ──
      + '<div class="pront-card-body p-3" id="prontBody-'+i+'">'
        + _renderDetalhe(c)
      + '</div>';

    container.appendChild(div);
  });
}

/* Extrai uma linha de resumo dos blocos */
function _extrairResumo(c) {
  // Tenta usar texto do primeiro bloco não-vazio
  for(var n = 1; n <= 6; n++) {
    var txt = c['bloco'+n+'_texto'];
    if(txt && txt.trim()) {
      var linha = txt.trim().split('\n')[0];
      return linha.length > 80 ? linha.substring(0,80)+'…' : linha;
    }
    // Tenta componentes
    var comps = c['bloco'+n+'_componentes'];
    if(comps && typeof comps === 'object') {
      var vals = Object.values(comps).filter(Boolean);
      if(vals.length) return (c['bloco'+n+'_nome']||'Bloco '+n)+': '+vals.slice(0,3).join(' · ');
    }
  }
  return c.tipo_consulta_nome ? 'Consulta — '+c.tipo_consulta_nome : 'Consulta registrada';
}

/* Renderiza detalhe completo de uma consulta */
function _renderDetalhe(c) {
  var html = '';

  // Médico que atendeu
  if(c.medico_inicio_nome || c.medico_fim_nome) {
    html += '<div class="d-flex gap-3 mb-3 p-2 rounded" style="background:#f0fff4;border:1px solid #d1e7dd;font-size:.8rem">';
    if(c.medico_inicio_nome) html += '<span><i class="bi bi-person-badge text-success me-1"></i><strong>Iniciado por:</strong> '+esc(c.medico_inicio_nome)+'</span>';
    if(c.medico_fim_nome && c.medico_fim_nome !== c.medico_inicio_nome) {
      html += '<span class="text-muted ms-2"><i class="bi bi-check-circle me-1"></i><strong>Encerrado por:</strong> '+esc(c.medico_fim_nome)+'</span>';
    }
    html += '</div>';
  }

  // Blocos (usa snapshot de nome/tipo salvos na consulta)
  var temBlocos = false;
  for(var n = 1; n <= 6; n++) {
    var nomBloco = c['bloco'+n+'_nome'];
    var tipBloco = c['bloco'+n+'_tipo'];
    var txtBloco = c['bloco'+n+'_texto'];
    var cmpBloco = c['bloco'+n+'_componentes'];

    var temConteudo = (txtBloco && txtBloco.trim()) ||
      (cmpBloco && typeof cmpBloco === 'object' && Object.values(cmpBloco).some(Boolean));
    if(!temConteudo) continue;
    temBlocos = true;

    var meta = _metaBloco(tipBloco);
    html += '<div class="bloco-pr">';
    html += '<div class="bloco-pr-hd"><i class="bi '+meta.ico+'" style="color:'+meta.cor+'"></i> '
      + esc(nomBloco || tipBloco || 'Bloco '+n)+'</div>';

    // Componentes com valores
    if(cmpBloco && typeof cmpBloco === 'object') {
      var compHtml = '';
      Object.entries(cmpBloco).forEach(function(kv) {
        if(kv[1]) compHtml += '<span class="comp-badge"><i class="bi bi-dot"></i> '+esc(kv[1])+'</span>';
      });
      if(compHtml) html += '<div class="mb-2">'+compHtml+'</div>';
    }

    // Texto livre
    if(txtBloco && txtBloco.trim()) {
      html += '<div class="bloco-pr-corpo">'+esc(txtBloco.trim())+'</div>';
    }
    html += '</div>';
  }

  // Prescrições
  if(c.prescricoes && c.prescricoes.length) {
    html += '<div class="bloco-pr" style="border-left-color:#0d6efd">';
    html += '<div class="bloco-pr-hd"><i class="bi bi-capsule-pill text-primary"></i> Prescrições ('+c.prescricoes.length+')</div>';
    c.prescricoes.forEach(function(p){
      html += '<div class="presc-row-pr"><strong>'+esc(p.medicamento||'')+'</strong>';
      var det = [p.dosagem,p.posologia,p.duracao].filter(Boolean).join(' · ');
      if(det) html += ' <span class="text-muted" style="font-size:.78rem">'+esc(det)+'</span>';
      html += '</div>';
    });
    html += '</div>';
  }

  // Exames
  if(c.exames_solicitados && c.exames_solicitados.length) {
    var ICON = { LAB:'🔬', IMG:'🖼', OUT:'📋' };
    html += '<div class="bloco-pr" style="border-left-color:#ffc107">';
    html += '<div class="bloco-pr-hd"><i class="bi bi-microscope text-warning"></i> Exames Solicitados ('+c.exames_solicitados.length+')</div>';
    c.exames_solicitados.forEach(function(e){
      html += '<div class="exame-row-pr">'+(ICON[e.subtipo]||'📋')+' <strong>'+esc(e.exame||'')+'</strong>';
      if(e.grupo) html += ' <span class="text-muted" style="font-size:.75rem">'+esc(e.grupo)+'</span>';
      if(e.observacao) html += '<div style="font-size:.78rem;color:#666">'+esc(e.observacao)+'</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  if(!temBlocos && !c.prescricoes?.length && !c.exames_solicitados?.length) {
    html += '<p class="text-muted small">Nenhum conteúdo registrado nesta consulta.</p>';
  }

  return html;
}

var BLOCO_META_PR = {
  SINAIS_VITAIS: { ico:'bi-heart-pulse-fill',    cor:'#dc3545' },
  ANAMNESE:      { ico:'bi-chat-left-text-fill',  cor:'#0dcaf0' },
  EXAME_FISICO:  { ico:'bi-clipboard2-pulse-fill',cor:'#198754' },
  DIAGNOSTICO:   { ico:'bi-journal-medical',      cor:'#6f42c1' },
  CONDUTA:       { ico:'bi-check2-square',        cor:'#198754' },
  OBSERVACOES:   { ico:'bi-sticky-fill',          cor:'#6c757d' },
  EXAMES:        { ico:'bi-microscope',           cor:'#ffc107' },
};
function _metaBloco(tipo) {
  return BLOCO_META_PR[tipo] || { ico:'bi-grid', cor:'#adb5bd' };
}

window.prontToggle = function(i) {
  var body = document.getElementById('prontBody-'+i);
  var chev = document.getElementById('prontChev-'+i);
  if(!body) return;
  var aberto = body.classList.toggle('aberto');
  if(chev) chev.className = (aberto ? 'bi bi-chevron-down' : 'bi bi-chevron-right') + ' text-muted';
};

/* ── Init ──────────────────────────────────────────────────────── */
async function inicializarProntuario() {
  PRONT.pcod    = window._prontuarioPcod    || null;
  PRONT.retorno = window._prontuarioRetorno || null;
  var btnLabel = document.getElementById('prontBtnLabel');
  if(btnLabel) btnLabel.textContent = PRONT.retorno === 'atendimento.html' ? 'Atendimento' : 'Agenda';
  if(PRONT.pcod) {
    document.getElementById('prontBuscaInput').value = String(PRONT.pcod);
    await _carregarProntuario(PRONT.pcod);
  }
}
