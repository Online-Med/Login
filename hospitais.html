<div class="d-flex justify-content-between align-items-center mb-3">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb mb-0">
      <li class="breadcrumb-item"><i class="bi bi-house"></i> INÍCIO</li>
      <li class="breadcrumb-item">Configurações</li>
      <li class="breadcrumb-item active fw-bold">HOSPITAIS</li>
    </ol>
  </nav>
  <div>
    <button class="btn btn-outline-secondary btn-sm me-2" onclick="HOSP.carregarHospitais()">
      <i class="bi bi-arrow-clockwise"></i>
    </button>
    <button class="btn btn-info text-white btn-sm" onclick="HOSP.novoHospital()">
      <i class="bi bi-plus-lg"></i> Novo Hospital
    </button>
  </div>
</div>

<div class="card shadow-sm mb-3">
  <div class="card-body p-0">
    <table class="table table-hover mb-0" style="font-size:.9rem">
      <thead class="table-light">
        <tr>
          <th style="width:120px">Ações</th>
          <th>Nome</th>
          <th>Telefones</th>
          <th>Endereço</th>
          <th>Contatos</th>
          <th class="text-center">Itens de Anexo</th>
        </tr>
      </thead>
      <tbody id="tabelaHospitais">
        <tr><td colspan="6" class="text-center p-4"><div class="spinner-border spinner-border-sm text-info"></div> Carregando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="modalHospital" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header py-2" style="background:linear-gradient(135deg,#0d6efd,#4361ee);color:#fff;">
        <h6 class="modal-title mb-0" id="modalHospitalTitulo"><i class="bi bi-hospital"></i> Novo Hospital</h6>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form id="formHospital">
          <input type="hidden" id="h_id">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small fw-bold">Nome do Hospital <span class="text-danger">*</span></label>
              <input type="text" id="h_nome" class="form-control form-control-sm" required>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-bold">Telefones (visível)</label>
              <input type="text" id="h_telefones" class="form-control form-control-sm" placeholder="(11) 2222-3333">
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-bold">Endereço</label>
              <input type="text" id="h_endereco" class="form-control form-control-sm" placeholder="Cidade - UF">
            </div>
          </div>

          <hr>
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <h6 class="mb-0">Contatos</h6>
              <button type="button" class="btn btn-sm btn-outline-primary" id="h_add_contact_btn"><i class="bi bi-plus"></i> Adicionar</button>
            </div>
            <div id="h_contacts" class="mt-2"></div>
          </div>

          <hr>
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <h6 class="mb-0">Itens de Anexo</h6>
              <button type="button" class="btn btn-sm btn-outline-primary" id="h_add_attachment_item_btn"><i class="bi bi-plus"></i> Novo item</button>
            </div>
            <div id="h_attachment_items" class="mt-2"></div>
          </div>
        </form>
      </div>

      <div class="modal-footer py-2">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-info text-white btn-sm" id="h_btnSalvar" onclick="HOSP.salvarHospital()">
          <i class="bi bi-save"></i> Salvar
        </button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // Utils
  function escapeHtml(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function $(sel, ctx) { return (ctx||document).querySelector(sel); }
  function $all(sel, ctx) { return Array.from((ctx||document).querySelectorAll(sel)); }

  function getApiHeaders() {
    var ue = (window.__USER_EMAIL || window.USER_EMAIL || '').trim();
    return ue ? { 'x-user-email': ue } : {};
  }

  window.HOSP = window.HOSP || {};
  var H = window.HOSP;
  H._lista = [];
  H._files = {};
  H._nextItemId = 1;

  // --- Renderização e Carregamento ---
  H.carregarHospitais = function () {
    var tbody = $('#tabelaHospitais');
    if (!tbody) return;
    var headers = getApiHeaders();
    
    fetch('/api/configuracoes?action=hospitais', { headers: headers })
      .then(r => r.json())
      .then(json => {
        H._lista = json.dados || [];
        H._renderTabela();
      }).catch(err => {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center p-3 text-danger">Erro de conexão.</td></tr>';
      });
  };

  H._renderTabela = function () {
    var tbody = $('#tabelaHospitais');
    tbody.innerHTML = H._lista.map(h => `
      <tr>
        <td class="ps-3"><button class="btn btn-sm btn-outline-primary" onclick="HOSP.editarHospital(${h.id})"><i class="bi bi-pencil"></i></button></td>
        <td>${escapeHtml(h.nome)}</td>
        <td>${escapeHtml(h.telefones)}</td>
        <td>${escapeHtml(h.endereco)}</td>
        <td>${h.contatos ? h.contatos.length : 0}</td>
        <td class="text-center">${h.anexos ? h.anexos.length : 0}</td>
      </tr>
    `).join('');
  };

  // --- Lógica de Salvamento com Segurança (Server-side Upload) ---
  H.salvarHospital = async function () {
    var btn = $('#h_btnSalvar');
    btn.disabled = true;

    try {
      var id = $('#h_id').value;
      var payload = {
        nome: $('#h_nome').value.trim(),
        telefones: $('#h_telefones').value.trim(),
        endereco: $('#h_endereco').value.trim()
      };

      // 1. Salvar dados básicos do hospital
      var res = await fetch('/api/configuracoes?action=hospitais' + (id ? '&id='+id : ''), {
        method: id ? 'PATCH' : 'POST',
        headers: { ...getApiHeaders(), 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(r => r.json());

      if (!res.sucesso) throw new Error(res.erro);
      var hospitalId = id || res.id;

      // 2. Upload de Arquivos via BACKEND (Protegendo as chaves)
      var items = getAttachmentItemsFromDOM();
      for (var it of items) {
        var filesArr = H._files[it._id] || [];
        for (var fobj of filesArr) {
          var formData = new FormData();
          formData.append('file', fobj.file);
          formData.append('hospital_id', hospitalId);
          formData.append('titulo_item', it.title);

          // Envia para a API do Vercel, que tem a chave do Supabase escondida no servidor
          await fetch('/api/configuracoes?action=upload_anexo', {
            method: 'POST',
            headers: getApiHeaders(),
            body: formData // Nota: FormData não precisa de Content-Type header manual
          });
        }
      }

      Swal.fire({ icon: 'success', title: 'Salvo com sucesso!', timer: 1500 });
      bootstrap.Modal.getInstance($('#modalHospital')).hide();
      H.carregarHospitais();

    } catch (err) {
      Swal.fire({ icon: 'error', title: 'Erro', text: err.message });
    } finally {
      btn.disabled = false;
    }
  };

  // --- Funções de UI para Contatos e Anexos (Simplificadas) ---
  function getAttachmentItemsFromDOM() {
    return $all('#h_attachment_items .card').map(n => ({
      _id: n.dataset.itemId,
      title: n.querySelector('.attachment-title').value
    }));
  }

  H.novoHospital = function() {
    $('#formHospital').reset();
    $('#h_id').value = '';
    $('#h_contacts').innerHTML = '';
    $('#h_attachment_items').innerHTML = '';
    H._files = {};
    new bootstrap.Modal($('#modalHospital')).show();
  };

  // Delegação de eventos para botões dinâmicos
  document.addEventListener('click', function(e) {
    if (e.target.id === 'h_add_contact_btn') {
       const div = document.createElement('div');
       div.className = 'row g-2 mb-2 contact-row';
       div.innerHTML = '<div class="col-4"><input class="form-control form-control-sm contact-local" placeholder="Local"></div><div class="col-4"><input class="form-control form-control-sm contact-name" placeholder="Nome"></div><div class="col-3"><input class="form-control form-control-sm contact-phone" placeholder="Tel"></div><div class="col-1"><button class="btn btn-sm btn-outline-danger" onclick="this.parentElement.parentElement.remove()"><i class="bi bi-x"></i></button></div>';
       $('#h_contacts').appendChild(div);
    }
    if (e.target.id === 'h_add_attachment_item_btn') {
       const itemId = 'item_' + Date.now();
       const div = document.createElement('div');
       div.className = 'card mb-2';
       div.dataset.itemId = itemId;
       div.innerHTML = `<div class="card-body py-2"><div class="d-flex gap-2"><input class="form-control form-control-sm attachment-title" placeholder="Título do anexo"><input type="file" class="form-control form-control-sm w-auto" onchange="HOSP.vincularArquivo('${itemId}', this.files)"></div></div>`;
       $('#h_attachment_items').appendChild(div);
    }
  });

  H.vincularArquivo = function(itemId, files) {
    H._files[itemId] = [{ file: files[0] }];
  };

  H.carregarHospitais();
})();
</script>
