<div class="d-flex justify-content-between align-items-center mb-3">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb mb-0">
      <li class="breadcrumb-item"><i class="bi bi-house"></i> INÍCIO</li>
      <li class="breadcrumb-item">Configurações</li>
      <li class="breadcrumb-item active fw-bold">HOSPITAIS</li>
    </ol>
  </nav>
  <div>
    <button class="btn btn-outline-secondary btn-sm me-2" onclick="HOSP.carregarHospitais()">
      <i class="bi bi-arrow-clockwise"></i>
    </button>
    <button class="btn btn-info text-white btn-sm" onclick="HOSP.novoHospital()">
      <i class="bi bi-plus-lg"></i> Novo Hospital
    </button>
  </div>
</div>


<div class="card shadow-sm mb-3">
  <div class="card-body p-0">
    <table class="table table-hover mb-0" style="font-size:.9rem">
      <thead class="table-light">
        <tr>
          <th style="width:110px">Ações</th>
          <th>Nome</th>
          <th>Telefones</th>
          <th>Endereço</th>
          <th style="width:120px" class="text-center">Anexos</th>
        </tr>
      </thead>
      <tbody id="tabelaHospitais">
        <tr><td colspan="5" class="text-center p-4"><div class="spinner-border spinner-border-sm text-info"></div> Carregando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal Hospital -->
<div class="modal fade" id="modalHospital" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header py-2" style="background:linear-gradient(135deg,#0d6efd,#4361ee);color:#fff;">
        <h6 class="modal-title mb-0" id="modalHospitalTitulo"><i class="bi bi-building"></i> Novo Hospital</h6>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formHospital">
          <input type="hidden" id="h_id">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label small fw-bold">Nome do Hospital <span class="text-danger">*</span></label>
              <input type="text" class="form-control form-control-sm" id="h_nome" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-bold">Telefones (separe por ,)</label>
              <input type="text" class="form-control form-control-sm" id="h_telefones" placeholder="(11) 2222-3333, (11) 98888-7777">
            </div>

            <div class="col-12">
              <label class="form-label small fw-bold">Endereço</label>
              <input type="text" class="form-control form-control-sm" id="h_endereco" placeholder="Rua, número, bairro, cidade - UF">
            </div>

            <div class="col-12">
              <label class="form-label small fw-bold">Anexar documentos (PDF / DOC / DOCX) — opcionais</label>
              <input type="file" class="form-control form-control-sm" id="h_arquivos" multiple accept=".pdf,.doc,.docx">
              <small class="text-muted">Selecione um ou mais arquivos e clique em salvar para enviar.</small>
            </div>

            <div class="col-12">
              <label class="form-label small fw-bold">Anexos existentes</label>
              <div id="h_lista_anexos" class="border rounded p-2" style="min-height:48px">
                <small class="text-muted">Nenhum anexo</small>
              </div>
            </div>

          </div>
        </form>
      </div>
      <div class="modal-footer py-2">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-info text-white btn-sm" id="h_btnSalvar" onclick="HOSP.salvarHospital()">
          <i class="bi bi-save"></i> Salvar
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Frontend script: coloca este bloco AO FINAL do hospitals fragment -->
<script>
(function () {
  'use strict';

  // Carrega SweetAlert2 se não existir (opcional)
  function loadSwalIfNeeded() {
    return new Promise(function (resolve) {
      if (typeof Swal !== 'undefined') return resolve();
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/sweetalert2@11';
      s.onload = resolve;
      s.onerror = resolve;
      document.head.appendChild(s);
    });
  }

  // Namespace global
  window.HOSP = window.HOSP || {};
  var H = window.HOSP;
  H._lista = [];

  // Util
  function escapeHtml(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // Render tabela
  H._renderTabela = function () {
    var tbody = document.getElementById('tabelaHospitais');
    if (!tbody) return;
    if (!H._lista || !H._lista.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center p-4">Nenhum hospital cadastrado.</td></tr>';
      return;
    }
    tbody.innerHTML = H._lista.map(function (h) {
      var telefones = h.telefones || '';
      var endereco = h.endereco || '';
      var anexosCount = Array.isArray(h.anexos) ? h.anexos.length : (h.anexos_count || 0);
      var nomeEsc = encodeURIComponent(h.nome || '');
      return '<tr>'
        + '<td class="ps-3 pe-1"><div class="btn-group" role="group">'
        + '<button class="btn btn-sm btn-outline-primary" title="Editar" onclick="HOSP.editarHospital(' + h.id + ')"><i class="bi bi-pencil"></i></button>'
        + '<button class="btn btn-sm btn-outline-danger" title="Excluir" onclick="HOSP.excluirHospital(' + h.id + ',\'' + nomeEsc + '\')"><i class="bi bi-trash"></i></button>'
        + '</div></td>'
        + '<td class="align-middle">' + escapeHtml(h.nome || '') + '</td>'
        + '<td class="align-middle small text-muted">' + escapeHtml(telefones) + '</td>'
        + '<td class="align-middle small text-muted">' + escapeHtml(endereco) + '</td>'
        + '<td class="text-center align-middle">' + (anexosCount ? ('<span class="badge bg-secondary">' + anexosCount + '</span>') : '<small class="text-muted">0</small>') + '</td>'
        + '</tr>';
    }).join('');
  };

  // Carrega lista do servidor
  H.carregarHospitais = function () {
    var tbody = document.getElementById('tabelaHospitais');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="5" class="text-center p-4"><div class="spinner-border spinner-border-sm text-info"></div> Carregando...</td></tr>';
    fetch('/api/hospitais')
      .then(function (r) { return r.json(); })
      .then(function (json) {
        if (!json || !json.dados) { tbody.innerHTML = '<tr><td colspan="5" class="text-center p-3 text-danger">Erro ao carregar.</td></tr>'; return; }
        H._lista = json.dados;
        H._renderTabela();
      })
      .catch(function (err) {
        console.error(err);
        tbody.innerHTML = '<tr><td colspan="5" class="text-center p-3 text-danger">Erro ao carregar.</td></tr>';
      });
  };

  // Abrir modal novo
  H.novoHospital = function () {
    document.getElementById('h_id').value = '';
    document.getElementById('h_nome').value = '';
    document.getElementById('h_telefones').value = '';
    document.getElementById('h_endereco').value = '';
    document.getElementById('h_arquivos').value = '';
    document.getElementById('h_lista_anexos').innerHTML = '<small class="text-muted">Nenhum anexo</small>';
    document.getElementById('modalHospitalTitulo').textContent = 'Novo Hospital';
    showModal('modalHospital');
  };

  // Preenche modal para editar
  H.editarHospital = function (id) {
    var h = (H._lista || []).find(function (x) { return x.id == id; });
    if (h) {
      fillModal(h);
      showModal('modalHospital');
      return;
    }
    fetch('/api/hospitais?id=' + encodeURIComponent(id))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var hosp = j && j.hospital ? j.hospital : (j && j.dados && j.dados[0] ? j.dados[0] : null);
        if (!hosp) { alert('Hospital não encontrado'); return; }
        fillModal(hosp);
        showModal('modalHospital');
      }).catch(function (e) { console.error(e); alert('Erro ao carregar hospital'); });

    function fillModal(hosp) {
      document.getElementById('h_id').value = hosp.id || '';
      document.getElementById('h_nome').value = hosp.nome || '';
      document.getElementById('h_telefones').value = hosp.telefones || '';
      document.getElementById('h_endereco').value = hosp.endereco || '';
      renderAnexos(hosp.anexos || []);
      document.getElementById('modalHospitalTitulo').textContent = 'Editar Hospital';
    }
  };

  // Salvar (POST ou PATCH)
  H.salvarHospital = function () {
    var id = document.getElementById('h_id').value;
    var nome = document.getElementById('h_nome').value.trim();
    if (!nome) { if (typeof Swal !== 'undefined') Swal.fire({ icon: 'warning', title: 'Informe o nome' }); else alert('Informe o nome'); return; }
    var telefones = document.getElementById('h_telefones').value.trim();
    var endereco = document.getElementById('h_endereco').value.trim();

    var payload = { nome: nome, telefones: telefones, endereco: endereco };
    var btn = document.getElementById('h_btnSalvar');
    if (btn) btn.disabled = true;

    var method = id ? 'PATCH' : 'POST';
    var url = '/api/hospitais' + (id ? ('?id=' + encodeURIComponent(id)) : '');

    fetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res || !res.sucesso) throw new Error(res && res.erro ? res.erro : 'Erro ao salvar');
        var newId = id || res.id || (res.dados && res.dados[0] && res.dados[0].id);
        var filesInput = document.getElementById('h_arquivos');
        if (filesInput && filesInput.files && filesInput.files.length && newId) {
          uploadAnexos(newId, filesInput.files).then(function () {
            if (typeof Swal !== 'undefined') Swal.fire({ icon: 'success', title: 'Salvo com anexos', timer: 1200, showConfirmButton: false });
            hideModal('modalHospital'); H.carregarHospitais(); if (btn) btn.disabled = false;
          }).catch(function (e) {
            console.error(e);
            if (typeof Swal !== 'undefined') Swal.fire({ icon: 'warning', title: 'Salvo, mas erro no upload de anexos' });
            hideModal('modalHospital'); H.carregarHospitais(); if (btn) btn.disabled = false;
          });
        } else {
          if (typeof Swal !== 'undefined') Swal.fire({ icon: 'success', title: 'Salvo', timer: 900, showConfirmButton: false });
          hideModal('modalHospital');
          H.carregarHospitais();
          if (btn) btn.disabled = false;
        }
      })
      .catch(function (err) {
        console.error(err);
        if (btn) btn.disabled = false;
        if (typeof Swal !== 'undefined') Swal.fire({ icon: 'error', title: 'Erro ao salvar', text: err.message }); else alert('Erro: ' + err.message);
      });
  };

  // Excluir hospital
  H.excluirHospital = function (id, nomeEscaped) {
    var nome = decodeURIComponent(nomeEscaped || '');
    var doDelete = function () {
      fetch('/api/hospitais?id=' + encodeURIComponent(id), { method: 'DELETE' })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.sucesso) {
            if (typeof Swal !== 'undefined') Swal.fire({ icon: 'success', title: 'Excluído', timer: 900, showConfirmButton: false });
            H.carregarHospitais();
          } else throw new Error(res && res.erro ? res.erro : 'Não foi possível excluir');
        }).catch(function (err) {
          if (typeof Swal !== 'undefined') Swal.fire({ icon: 'error', title: 'Erro', text: err.message || err }); else alert('Erro: ' + (err.message || err));
        });
    };

    if (typeof Swal !== 'undefined') {
      Swal.fire({
        title: 'Excluir hospital?',
        html: 'Deseja excluir <strong>' + escapeHtml(nome) + '</strong>?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Sim, excluir',
        cancelButtonText: 'Cancelar',
        confirmButtonColor: '#d33'
      }).then(function (result) { if (result.isConfirmed) doDelete(); });
    } else {
      if (confirm('Excluir hospital "' + nome + '"?')) doDelete();
    }
  };

  // Upload de anexos
  function uploadAnexos(hospitalId, filesList) {
    return new Promise(function (resolve, reject) {
      var fd = new FormData();
      for (var i = 0; i < filesList.length; i++) fd.append('files[]', filesList[i]);
      var url = '/api/hospitais/attachments?hospital_id=' + encodeURIComponent(hospitalId);
      fetch(url, { method: 'POST', body: fd })
        .then(function (r) { return r.json(); })
        .then(function (res) { if (res && res.sucesso) resolve(res.anexos || []); else reject(new Error(res && res.erro ? res.erro : 'Erro upload')); })
        .catch(function (err) { reject(err); });
    });
  }

  // Renderiza anexos no modal
  function renderAnexos(anexos) {
    var cont = document.getElementById('h_lista_anexos');
    if (!cont) return;
    if (!anexos || !anexos.length) { cont.innerHTML = '<small class="text-muted">Nenhum anexo</small>'; return; }
    cont.innerHTML = anexos.map(function (a) {
      var nome = a.nome || a.filename || (a.url && a.url.split('/').pop()) || 'arquivo';
      var url = a.url || '#';
      return '<div class="d-flex align-items-center justify-content-between mb-1">'
        + '<div class="small"><a href="' + escapeHtml(url) + '" target="_blank">' + escapeHtml(nome) + '</a></div>'
        + '<div><button class="btn btn-sm btn-outline-danger" onclick="HOSP.excluirAnexo(' + a.id + ')"><i class="bi bi-x"></i></button></div>'
        + '</div>';
    }).join('');
  }

  // Excluir anexo
  H.excluirAnexo = function (attachId) {
    if (!attachId) return;
    if (typeof Swal !== 'undefined') {
      Swal.fire({
        title: 'Excluir anexo?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Excluir'
      }).then(function (r) {
        if (!r.isConfirmed) return;
        fetch('/api/hospitais/attachments?id=' + encodeURIComponent(attachId), { method: 'DELETE' })
          .then(function (rr) { return rr.json(); })
          .then(function (res) {
            if (res && res.sucesso) { Swal.fire({ icon: 'success', title: 'Anexo excluído', timer: 800, showConfirmButton: false }); H.carregarHospitais(); }
            else throw new Error('Erro');
          })
          .catch(function (e) { Swal.fire({ icon: 'error', title: 'Erro', text: e.message || e }); });
      });
    } else {
      if (!confirm('Excluir anexo?')) return;
      fetch('/api/hospitais/attachments?id=' + encodeURIComponent(attachId), { method: 'DELETE' }).then(function () { H.carregarHospitais(); });
    }
  };

  // Modal helpers (Bootstrap 5)
  function showModal(id) {
    var el = document.getElementById(id); if (!el) return;
    var m = bootstrap.Modal.getOrCreateInstance(el); m.show();
  }
  function hideModal(id) {
    var el = document.getElementById(id); if (!el) return;
    var m = bootstrap.Modal.getInstance(el); if (m) m.hide();
  }

  // Init: carrega bibliotecas necessárias e lista
  loadSwalIfNeeded().finally(function () {
    // carrega a lista quando DOM estiver pronto
    document.addEventListener('DOMContentLoaded', function () { setTimeout(function () { H.carregarHospitais(); }, 80); });
  });

})();
</script>
