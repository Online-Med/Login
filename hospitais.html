<div class="d-flex justify-content-between align-items-center mb-3">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb mb-0">
      <li class="breadcrumb-item"><i class="bi bi-house"></i> INÍCIO</li>
      <li class="breadcrumb-item">Configurações</li>
      <li class="breadcrumb-item active fw-bold">HOSPITAIS</li>
    </ol>
  </nav>
  <div>
    <button class="btn btn-outline-secondary btn-sm me-2" onclick="HOSP.carregarHospitais()">
      <i class="bi bi-arrow-clockwise"></i>
    </button>
    <button class="btn btn-info text-white btn-sm" onclick="HOSP.novoHospital()">
      <i class="bi bi-plus-lg"></i> Novo Hospital
    </button>
  </div>
</div>

<div class="card shadow-sm mb-3">
  <div class="card-body p-0">
    <table class="table table-hover mb-0" style="font-size:.9rem">
      <thead class="table-light">
        <tr>
          <th style="width:120px">Ações</th>
          <th>Nome</th>
          <th>Telefones</th>
          <th>Endereço</th>
          <th>Contatos</th>
          <th class="text-center">Itens de Anexo</th>
        </tr>
      </thead>
      <tbody id="tabelaHospitais">
        <tr><td colspan="6" class="text-center p-4"><div class="spinner-border spinner-border-sm text-info"></div> Carregando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="modalHospital" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header py-2" style="background:linear-gradient(135deg,#0d6efd,#4361ee);color:#fff;">
        <h6 class="modal-title mb-0" id="modalHospitalTitulo"><i class="bi bi-hospital"></i> Novo Hospital</h6>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form id="formHospital">
          <input type="hidden" id="h_id">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small fw-bold">Nome do Hospital <span class="text-danger">*</span></label>
              <input type="text" id="h_nome" class="form-control form-control-sm" required>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-bold">Telefones (visível)</label>
              <input type="text" id="h_telefones" class="form-control form-control-sm" placeholder="(11) 2222-3333">
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-bold">Endereço</label>
              <input type="text" id="h_endereco" class="form-control form-control-sm" placeholder="Rua, Bairro, Cidade - UF">
            </div>
          </div>

          <hr>
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <h6 class="mb-0">Contatos (local — nome — telefone)</h6>
              <button type="button" class="btn btn-sm btn-outline-primary" id="h_add_contact_btn"><i class="bi bi-plus"></i> Adicionar contato</button>
            </div>
            <div id="h_contacts" class="mt-2"></div>
          </div>

          <hr>
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <h6 class="mb-0">Itens de Anexo (ex.: "termo de cesaria")</h6>
              <button type="button" class="btn btn-sm btn-outline-primary" id="h_add_attachment_item_btn"><i class="bi bi-plus"></i> Novo item</button>
            </div>
            <div id="h_attachment_items" class="mt-2"></div>
          </div>
        </form>
      </div>

      <div class="modal-footer py-2">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-info text-white btn-sm" id="h_btnSalvar" onclick="HOSP.salvarHospital()">
          <i class="bi bi-save"></i> Salvar
        </button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  function escapeHtml(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function $(sel, ctx) { return (ctx||document).querySelector(sel); }
  function $all(sel, ctx) { return Array.from((ctx||document).querySelectorAll(sel)); }

  function getApiHeaders(isJson) {
    var headers = {};
    if (isJson) headers['Content-Type'] = 'application/json';
    var ue = (window.__USER_EMAIL || window.USER_EMAIL || '').trim();
    if (ue) headers['x-user-email'] = ue;
    return headers;
  }

  window.HOSP = window.HOSP || {};
  var H = window.HOSP;
  H._lista = [];
  H._files = {}; 
  H._nextItemId = 1;

  // --- TABELA ---
  H.carregarHospitais = function () {
    var tbody = $('#tabelaHospitais');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="6" class="text-center p-4"><div class="spinner-border spinner-border-sm text-info"></div> Carregando...</td></tr>';

    fetch('/api/configuracoes?action=hospitais', { headers: getApiHeaders(true) })
      .then(r => r.json())
      .then(json => {
        H._lista = json.dados || [];
        H._renderTabela();
      }).catch(err => {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center p-3 text-danger">Erro de conexão.</td></tr>';
      });
  };

  H._renderTabela = function () {
    var tbody = $('#tabelaHospitais');
    if (!H._lista.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center p-4">Nenhum hospital cadastrado.</td></tr>';
      return;
    }
    tbody.innerHTML = H._lista.map(h => `
      <tr>
        <td class="ps-3 pe-1">
          <div class="btn-group">
            <button class="btn btn-sm btn-outline-primary" onclick="HOSP.editarHospital(${h.id})"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="HOSP.excluirHospital(${h.id}, '${encodeURIComponent(h.nome)}')"><i class="bi bi-trash"></i></button>
          </div>
        </td>
        <td class="align-middle">${escapeHtml(h.nome)}</td>
        <td class="align-middle small text-muted">${escapeHtml(h.telefones)}</td>
        <td class="align-middle small text-muted">${escapeHtml(h.endereco)}</td>
        <td class="align-middle small text-muted"><span class="badge bg-secondary">${h.contatos ? h.contatos.length : 0}</span></td>
        <td class="text-center align-middle"><span class="badge bg-secondary">${h.anexos ? h.anexos.length : 0}</span></td>
      </tr>
    `).join('');
  };

  // --- SALVAR COM UPLOAD SEGURO ---
  H.salvarHospital = async function () {
    var btn = $('#h_btnSalvar');
    btn.disabled = true;

    try {
      var id = $('#h_id').value;
      var payload = {
        nome: $('#h_nome').value.trim(),
        telefones: $('#h_telefones').value.trim(),
        endereco: $('#h_endereco').value.trim(),
        contatos: getContactsFromDOM()
      };

      if (!payload.nome) throw new Error('O nome é obrigatório');

      var res = await fetch('/api/configuracoes?action=hospitais' + (id ? '&id='+id : ''), {
        method: id ? 'PATCH' : 'POST',
        headers: getApiHeaders(true),
        body: JSON.stringify(payload)
      }).then(r => r.json());

      if (!res.sucesso) throw new Error(res.erro || 'Erro ao salvar');
      var hospitalId = id || res.id || (res.dados && res.dados[0].id);

      // Upload de Arquivos via servidor (action=upload_anexo)
      var items = getAttachmentItemsFromDOM();
      for (var it of items) {
        var filesArr = H._files[it._id] || [];
        for (var fobj of filesArr) {
          if (!fobj.file) continue; // ignora se já estava no banco e não mudou
          
          var formData = new FormData();
          formData.append('file', fobj.file);
          formData.append('hospital_id', hospitalId);
          formData.append('titulo_item', it.title);

          await fetch('/api/configuracoes?action=upload_anexo', {
            method: 'POST',
            headers: getApiHeaders(false),
            body: formData
          });
        }
      }

      Swal.fire({ icon: 'success', title: 'Salvo!', timer: 1500, showConfirmButton: false });
      bootstrap.Modal.getOrCreateInstance($('#modalHospital')).hide();
      H.carregarHospitais();
    } catch (err) {
      Swal.fire({ icon: 'error', title: 'Erro', text: err.message });
    } finally {
      btn.disabled = false;
    }
  };

  // --- AUXILIARES DE INTERFACE ---
  function getContactsFromDOM() {
    return $all('#h_contacts .contact-row').map(r => ({
      local: r.querySelector('.contact-local').value.trim(),
      nome: r.querySelector('.contact-name').value.trim(),
      telefone: r.querySelector('.contact-phone').value.trim()
    })).filter(c => c.local || c.nome || c.telefone);
  }

  function getAttachmentItemsFromDOM() {
    return $all('#h_attachment_items .card').map(n => ({
      _id: n.dataset.itemId,
      title: n.querySelector('.attachment-title').value.trim()
    }));
  }

  H.novoHospital = function() {
    $('#formHospital').reset();
    $('#h_id').value = '';
    $('#h_contacts').innerHTML = '<div class="small text-muted">Nenhum contato.</div>';
    $('#h_attachment_items').innerHTML = '<div class="small text-muted">Nenhum item.</div>';
    H._files = {};
    document.getElementById('modalHospitalTitulo').textContent = 'Novo Hospital';
    bootstrap.Modal.getOrCreateInstance($('#modalHospital')).show();
  };

  H.editarHospital = function(id) {
    fetch('/api/configuracoes?action=hospitais&id=' + id, { headers: getApiHeaders(true) })
      .then(r => r.json())
      .then(json => {
        var h = json.dados[0];
        $('#h_id').value = h.id;
        $('#h_nome').value = h.nome || '';
        $('#h_telefones').value = h.telefones || '';
        $('#h_endereco').value = h.endereco || '';
        
        renderContacts(h.contatos || []);
        renderAttachments(h.anexos || []);
        
        document.getElementById('modalHospitalTitulo').textContent = 'Editar Hospital';
        bootstrap.Modal.getOrCreateInstance($('#modalHospital')).show();
      });
  };

  H.excluirHospital = function(id, nomeEnc) {
    var nome = decodeURIComponent(nomeEnc);
    Swal.fire({
      title: 'Excluir?',
      text: 'Deseja remover o hospital ' + nome + '?',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'Sim, excluir',
      confirmButtonColor: '#d33'
    }).then(res => {
      if (res.isConfirmed) {
        fetch('/api/configuracoes?action=hospitais&id=' + id, { method: 'DELETE', headers: getApiHeaders(true) })
          .then(() => { H.carregarHospitais(); Swal.fire('Excluído!', '', 'success'); });
      }
    });
  };

  function renderContacts(list) {
    var cont = $('#h_contacts');
    cont.innerHTML = list.length ? '' : '<div class="small text-muted">Nenhum contato.</div>';
    list.forEach(c => addContactRow(c));
  }

  function addContactRow(c = {}) {
    var cont = $('#h_contacts');
    if (cont.querySelector('.text-muted')) cont.innerHTML = '';
    var div = document.createElement('div');
    div.className = 'row g-2 mb-2 contact-row';
    div.innerHTML = `
      <div class="col-md-4"><input type="text" class="form-control form-control-sm contact-local" value="${escapeHtml(c.local)}" placeholder="Local"></div>
      <div class="col-md-4"><input type="text" class="form-control form-control-sm contact-name" value="${escapeHtml(c.nome)}" placeholder="Nome"></div>
      <div class="col-md-3"><input type="text" class="form-control form-control-sm contact-phone" value="${escapeHtml(c.telefone)}" placeholder="Telefone"></div>
      <div class="col-md-1 text-end"><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.contact-row').remove()"><i class="bi bi-x"></i></button></div>
    `;
    cont.appendChild(div);
  }

  function renderAttachments(list) {
    var cont = $('#h_attachment_items');
    cont.innerHTML = list.length ? '' : '<div class="small text-muted">Nenhum item.</div>';
    list.forEach(a => {
      var itemId = 'db_' + a.id;
      H._files[itemId] = [{ name: a.nome, url: a.url }];
      addAttachmentRow({ _id: itemId, title: a.titulo_item || a.nome, files: H._files[itemId] });
    });
  }

  function addAttachmentRow(it = {}) {
    var cont = $('#h_attachment_items');
    if (cont.querySelector('.text-muted')) cont.innerHTML = '';
    var itemId = it._id || 'item_' + (H._nextItemId++);
    var div = document.createElement('div');
    div.className = 'card mb-2';
    div.dataset.itemId = itemId;
    div.innerHTML = `
      <div class="card-body py-2">
        <div class="d-flex align-items-center gap-2">
          <input type="text" class="form-control form-control-sm attachment-title" value="${escapeHtml(it.title)}" placeholder="Título">
          <input type="file" class="form-control form-control-sm w-auto" onchange="HOSP.vincularArquivo('${itemId}', this.files)">
          <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.card').remove()"><i class="bi bi-trash"></i></button>
        </div>
        <div class="small mt-1 files-list">${it.files ? it.files.map(f => `<a href="${f.url}" target="_blank" class="me-2">${f.name}</a>`).join('') : ''}</div>
      </div>
    `;
    cont.appendChild(div);
  }

  H.vincularArquivo = function(itemId, files) {
    H._files[itemId] = [{ file: files[0] }];
    var card = document.querySelector(`[data-item-id="${itemId}"] .files-list`);
    card.innerHTML = `<span class="text-primary">${files[0].name} (Pronto para salvar)</span>`;
  };

  // Eventos de clique
  document.getElementById('h_add_contact_btn').onclick = () => addContactRow();
  document.getElementById('h_add_attachment_item_btn').onclick = () => addAttachmentRow();

  H.carregarHospitais();
})();
</script>
