<div class="d-flex justify-content-between align-items-center mb-3">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb mb-0">
      <li class="breadcrumb-item"><i class="bi bi-house"></i> INÍCIO</li>
      <li class="breadcrumb-item">Configurações</li>
      <li class="breadcrumb-item active fw-bold">HOSPITAIS</li>
    </ol>
  </nav>
  <div>
    <button class="btn btn-outline-secondary btn-sm me-2" onclick="HOSP.carregarHospitais()">
      <i class="bi bi-arrow-clockwise"></i>
    </button>
    <button class="btn btn-info text-white btn-sm" onclick="HOSP.novoHospital()">
      <i class="bi bi-plus-lg"></i> Novo Hospital
    </button>
  </div>
</div>

<div class="card shadow-sm mb-3">
  <div class="card-body p-0">
    <table class="table table-hover mb-0" style="font-size:.9rem">
      <thead class="table-light">
        <tr>
          <th style="width:120px">Ações</th>
          <th>Nome</th>
          <th>Telefones</th>
          <th>Endereço</th>
          <th>Contatos</th>
          <th class="text-center">Itens de Anexo</th>
        </tr>
      </thead>
      <tbody id="tabelaHospitais">
        <tr><td colspan="6" class="text-center p-4"><div class="spinner-border spinner-border-sm text-info"></div> Carregando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="modalHospital" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header py-2" style="background:linear-gradient(135deg,#0d6efd,#4361ee);color:#fff;">
        <h6 class="modal-title mb-0" id="modalHospitalTitulo"><i class="bi bi-hospital"></i> Novo Hospital</h6>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form id="formHospital">
          <input type="hidden" id="h_id">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small fw-bold">Nome do Hospital <span class="text-danger">*</span></label>
              <input type="text" id="h_nome" class="form-control form-control-sm" required>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-bold">Telefones (visível)</label>
              <input type="text" id="h_telefones" class="form-control form-control-sm" placeholder="(11) 2222-3333">
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-bold">Endereço</label>
              <input type="text" id="h_endereco" class="form-control form-control-sm" placeholder="Rua, Bairro, Cidade - UF">
            </div>
          </div>

          <hr>
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <h6 class="mb-0">Contatos (local — nome — telefone)</h6>
              <button type="button" class="btn btn-sm btn-outline-primary" id="h_add_contact_btn"><i class="bi bi-plus"></i> Adicionar contato</button>
            </div>
            <div id="h_contacts" class="mt-2"></div>
          </div>

          <hr>
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <h6 class="mb-0">Itens de Anexo (ex.: "termo de cesaria")</h6>
              <button type="button" class="btn btn-sm btn-outline-primary" id="h_add_attachment_item_btn"><i class="bi bi-plus"></i> Novo item</button>
            </div>
            <div id="h_attachment_items" class="mt-2"></div>
          </div>
        </form>
      </div>

      <div class="modal-footer py-2">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-info text-white btn-sm" id="h_btnSalvar" onclick="HOSP.salvarHospital()">
          <i class="bi bi-save"></i> Salvar
        </button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  function escapeHtml(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function $(sel, ctx) { return (ctx||document).querySelector(sel); }
  function $all(sel, ctx) { return Array.from((ctx||document).querySelectorAll(sel)); }

  function getApiHeaders(isJson) {
    var headers = {};
    if (isJson) headers['Content-Type'] = 'application/json';
    var ue = (window.__USER_EMAIL || window.USER_EMAIL || '').trim();
    if (ue) headers['x-user-email'] = ue;
    return headers;
  }

  // Define o objeto global IMEDIATAMENTE
  window.HOSP = window.HOSP || {};
  var H = window.HOSP;

  H._lista = [];
  H._files = {}; 
  H._nextItemId = 1;

  H.carregarHospitais = function () {
    var tbody = $('#tabelaHospitais');
    if (!tbody) return;
    fetch('/api/configuracoes?action=hospitais', { headers: getApiHeaders(true) })
      .then(r => r.json())
      .then(json => {
        H._lista = json.dados || [];
        H._renderTabela();
      });
  };

  H._renderTabela = function () {
    var tbody = $('#tabelaHospitais');
    tbody.innerHTML = H._lista.map(h => `
      <tr>
        <td class="ps-3">
          <div class="btn-group">
            <button class="btn btn-sm btn-outline-primary" onclick="HOSP.editarHospital(${h.id})"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="HOSP.excluirHospital(${h.id}, '${encodeURIComponent(h.nome)}')"><i class="bi bi-trash"></i></button>
          </div>
        </td>
        <td>${escapeHtml(h.nome)}</td>
        <td>${escapeHtml(h.telefones)}</td>
        <td>${escapeHtml(h.endereco)}</td>
        <td>${h.contatos ? h.contatos.length : 0}</td>
        <td class="text-center">${h.anexos ? h.anexos.length : 0}</td>
      </tr>
    `).join('');
  };

  H.editarHospital = function(id) {
    fetch('/api/configuracoes?action=hospitais&id=' + id, { headers: getApiHeaders(true) })
      .then(r => r.json())
      .then(json => {
        var h = json.dados[0];
        $('#h_id').value = h.id;
        $('#h_nome').value = h.nome || '';
        $('#h_telefones').value = h.telefones || '';
        $('#h_endereco').value = h.endereco || '';
        
        $('#h_contacts').innerHTML = '';
        (h.contatos || []).forEach(c => H.addContactRow(c));
        
        $('#h_attachment_items').innerHTML = '';
        (h.anexos || []).forEach(a => H.addAttachmentRow({title: a.titulo_item, nome: a.nome, url: a.url}));

        document.getElementById('modalHospitalTitulo').textContent = 'Editar Hospital';
        bootstrap.Modal.getOrCreateInstance($('#modalHospital')).show();
      });
  };

  H.salvarHospital = async function () {
    var btn = $('#h_btnSalvar');
    btn.disabled = true;
    try {
      var id = $('#h_id').value;
      var payload = {
        nome: $('#h_nome').value.trim(),
        telefones: $('#h_telefones').value.trim(),
        endereco: $('#h_endereco').value.trim(),
        contatos: $all('#h_contacts .contact-row').map(r => ({
          local: r.querySelector('.contact-local').value,
          nome: r.querySelector('.contact-name').value,
          telefone: r.querySelector('.contact-phone').value
        }))
      };

      const res = await fetch('/api/configuracoes?action=hospitais' + (id ? '&id='+id : ''), {
        method: id ? 'PATCH' : 'POST',
        headers: getApiHeaders(true),
        body: JSON.stringify(payload)
      }).then(r => r.json());

      if (!res.sucesso) throw new Error(res.erro);

      // Tenta upload de anexos
      const items = $all('#h_attachment_items .card');
      for (const item of items) {
        const fileInput = item.querySelector('input[type="file"]');
        if (fileInput.files.length > 0) {
          const formData = new FormData();
          formData.append('file', fileInput.files[0]);
          formData.append('hospital_id', id || res.id);
          formData.append('titulo_item', item.querySelector('.attachment-title').value);

          await fetch('/api/configuracoes?action=upload_anexo', {
            method: 'POST',
            headers: getApiHeaders(false),
            body: formData
          });
        }
      }

      bootstrap.Modal.getInstance($('#modalHospital')).hide();
      H.carregarHospitais();
      Swal.fire('Salvo!', '', 'success');
    } catch (e) {
      Swal.fire('Erro', e.message, 'error');
    } finally {
      btn.disabled = false;
    }
  };

  H.addContactRow = function(c = {}) {
    const div = document.createElement('div');
    div.className = 'row g-2 mb-2 contact-row';
    div.innerHTML = `
      <div class="col-4"><input class="form-control form-control-sm contact-local" value="${c.local||''}" placeholder="Local"></div>
      <div class="col-4"><input class="form-control form-control-sm contact-name" value="${c.nome||''}" placeholder="Nome"></div>
      <div class="col-3"><input class="form-control form-control-sm contact-phone" value="${c.telefone||''}" placeholder="Tel"></div>
      <div class="col-1"><button class="btn btn-sm btn-outline-danger" onclick="this.closest('.row').remove()"><i class="bi bi-x"></i></button></div>`;
    $('#h_contacts').appendChild(div);
  };

  H.addAttachmentRow = function(a = {}) {
    const div = document.createElement('div');
    div.className = 'card mb-2';
    div.innerHTML = `
      <div class="card-body py-2">
        <div class="d-flex gap-2">
          <input class="form-control form-control-sm attachment-title" value="${a.title||''}" placeholder="Título">
          <input type="file" class="form-control form-control-sm">
          <button class="btn btn-sm btn-outline-danger" onclick="this.closest('.card').remove()"><i class="bi bi-trash"></i></button>
        </div>
        ${a.url ? `<small><a href="${a.url}" target="_blank">${a.nome}</a></small>` : ''}
      </div>`;
    $('#h_attachment_items').appendChild(div);
  };

  H.novoHospital = function() {
    $('#h_id').value = '';
    $('#formHospital').reset();
    $('#h_contacts').innerHTML = '';
    $('#h_attachment_items').innerHTML = '';
    bootstrap.Modal.getOrCreateInstance($('#modalHospital')).show();
  };

  // Inicializa
  document.getElementById('h_add_contact_btn').onclick = () => H.addContactRow();
  document.getElementById('h_add_attachment_item_btn').onclick = () => H.addAttachmentRow();
  H.carregarHospitais();

})();
</script>
