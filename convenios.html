<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold">Convênios</h4>
    <button class="btn btn-primary" onclick="novoConvenio()">+ Novo</button>
</div>
<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="bg-light">
                <tr><th class="ps-3">ID</th><th>Convênio</th><th class="text-center">Ações</th></tr>
            </thead>
            <tbody id="tabelaConvenios"></tbody>
        </table>
    </div>
</div>
<script>
async function carregar() {
    const res = await fetch('/api/convenios');
    const json = await res.json();
    const corpo = document.getElementById('tabelaConvenios');
    corpo.innerHTML = '';
    if (json.dados) {
        json.dados.forEach(u => {
            corpo.innerHTML += `<tr><td class="ps-3">${u.id}</td><td>${u.CONVENIO}</td><td class="text-center"><button class="btn btn-sm btn-outline-primary" onclick="editarConvenio(${u.id})">Editar</button></td></tr>`;
        });
    }
}
carregar();
function novoConvenio() { window.ehEdicaoConvenio = false; carregarConteudo('cadastro_convenios.html'); }
function editarConvenio(id) { window.ehEdicaoConvenio = true; window.idUsuarioEdicao = id; carregarConteudo('cadastro_convenios.html'); }
</script>
