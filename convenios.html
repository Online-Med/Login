<div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Convênios</h4>
    <button class="btn btn-primary" onclick="novoConvenio()">
        <i class="bi bi-person-plus me-2"></i>Novo Convênio
    </button>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Convenio</th>
                    <th class="text-center">Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaConvenios"></tbody>
        </table>
    </div>
</div>

<script>
async function carregarConvenios() {
    const res = await fetch('/api/convenios');
    const json = await res.json();
    const corpo = document.getElementById('tabelaConvenios');
    corpo.innerHTML = '';

    if (json.dados) {
        json.dados.forEach(u => {
            corpo.innerHTML += `
                <tr>
                    <td>${u.id}</td>
                    <td>${u.CONVENIO}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-primary" onclick="editarConvenio(${u.id})">
                            <i class="bi bi-pencil"></i>
                        </button>
                    </td>
                </tr>`;
        });
    }
}
carregarConvenios();

function novoConvenio() {
    window.ehEdicaoConvenio = false;
    carregarConteudo('cadastro_convenios.html');
}

function editarConvenio(id) {
    window.ehEdicaoConvenio = true;
    window.idUsuarioEdicao = id;
    carregarConteudo('cadastro_convenios.html');
}
</script>
