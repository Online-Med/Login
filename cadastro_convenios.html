<div class="d-flex justify-content-between align-items-center mb-3">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">INÍCIO</li>
            <li class="breadcrumb-item">Configurações</li>
            <li class="breadcrumb-item active">CADASTRO DE CONVÊNIOS</li>
        </ol>
    </nav>
    <div class="d-flex gap-2">
        <button type="button" class="btn btn-secondary" onclick="cancelarConvenio()">Cancelar</button>
        <button type="button" class="btn btn-info text-white" onclick="salvarConvenio()">Salvar Registro</button>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form id="formConvenio">
            <div class="row g-3">
                <div class="col-md-2">
                    <label class="form-label fw-bold">Código</label>
                    <input type="text" class="form-control bg-light" id="c_id" readonly>
                </div>
                <div class="col-md-10">
                    <label class="form-label fw-bold">Nome do Convênio *</label>
                    <input type="text" class="form-control" id="c_nome" required>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
async function inicializarCadastroConvenio() {
    const campoId = document.getElementById('c_id');
    const campoNome = document.getElementById('c_nome');

    if (window.ehEdicaoConvenio && window.idUsuarioEdicao) {
        const res = await fetch(`/api/convenios?id=${window.idUsuarioEdicao}`);
        const json = await res.json();
        if (json.sucesso) {
            campoId.value = json.convenio.id;
            campoNome.value = json.convenio.CONVENIO;
        }
    } else {
        const res = await fetch('/api/convenios', { method: 'POST' });
        const json = await res.json();
        if (json.sucesso && json.id) {
            campoId.value = json.id;
            campoNome.value = "";
        } else {
            alert("Erro ao reservar ID no servidor.");
        }
    }
}

async function salvarConvenio() {
    const id = document.getElementById('c_id').value;
    const nome = document.getElementById('c_nome').value;
    
    const res = await fetch(`/api/convenios?id=${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ CONVENIO: nome.toUpperCase() })
    });

    if (res.ok) carregarConteudo('convenios.html');
}

async function cancelarConvenio() {
    const id = document.getElementById('c_id').value;
    const nome = document.getElementById('c_nome').value;
    if (!window.ehEdicaoConvenio && (nome === "" || nome === "NOVO CONVÊNIO")) {
        await fetch(`/api/convenios?id=${id}`, { method: 'DELETE' });
    }
    carregarConteudo('convenios.html');
}

inicializarCadastroConvenio();
</script>
