<div class="d-flex justify-content-between align-items-center mb-4">
    <h5 class="text-primary fw-bold mb-0">CADASTRO DE CONVÊNIO</h5>
    <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary px-4" onclick="cancelarConvenio()">Cancelar</button>
        <button class="btn btn-primary px-4 shadow-sm" onclick="salvarConvenio()">Salvar</button>
    </div>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <div class="row g-3">
            <div class="col-md-2">
                <label class="form-label fw-bold">ID</label>
                <input type="text" class="form-control bg-light" id="c_id" readonly>
            </div>
            <div class="col-md-10">
                <label class="form-label fw-bold">Nome do Convênio *</label>
                <input type="text" class="form-control" id="c_nome" placeholder="Ex: UNIMED" required>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
async function inicializar() {
    if (window.ehEdicaoConvenio && window.idUsuarioEdicao) {
        const res = await fetch(`/api/convenios?id=${window.idUsuarioEdicao}`);
        const json = await res.json();
        if (json.sucesso) {
            document.getElementById('c_id').value = json.convenio.id;
            document.getElementById('c_nome').value = json.convenio.CONVENIO;
        }
    } else {
        const res = await fetch('/api/convenios', { method: 'POST' });
        const json = await res.json();
        if (json.sucesso) {
            document.getElementById('c_id').value = json.id;
        } else {
            Swal.fire('Erro', 'Não foi possível reservar o ID. Verifique o autoincremento no Supabase.', 'error');
        }
    }
}

async function salvarConvenio() {
    const id = document.getElementById('c_id').value;
    const nome = document.getElementById('c_nome').value;
    if(!nome) return Swal.fire('Aviso', 'Preencha o nome.', 'warning');

    const res = await fetch(`/api/convenios?id=${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ CONVENIO: nome.toUpperCase() })
    });
    if (res.ok) carregarConteudo('convenios.html');
}

async function cancelarConvenio() {
    if (!window.ehEdicaoConvenio) {
        const id = document.getElementById('c_id').value;
        if (id) await fetch(`/api/convenios?id=${id}`, { method: 'DELETE' });
    }
    carregarConteudo('convenios.html');
}
inicializar();
</script>
