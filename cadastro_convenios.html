<div class="d-flex justify-content-between align-items-center mb-4">
    <h5 class="text-primary fw-bold"><i class="bi bi-plus-circle me-2"></i>CADASTRO DE CONVÊNIO</h5>
    <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary px-4" onclick="cancelarConvenio()">Cancelar</button>
        <button class="btn btn-primary px-4 shadow-sm" onclick="salvarConvenio()">Salvar Registro</button>
    </div>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <div class="row g-3">
            <div class="col-md-2">
                <label class="form-label fw-bold text-muted">ID</label>
                <input type="text" class="form-control bg-light" id="c_id" readonly placeholder="#">
            </div>
            <div class="col-md-10">
                <label class="form-label fw-bold">Nome do Convênio *</label>
                <input type="text" class="form-control form-control-lg" id="c_nome" placeholder="Ex: UNIMED">
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
async function iniciar() {
    const campoId = document.getElementById('c_id');
    const campoNome = document.getElementById('c_nome');

    if (window.ehEdicaoConvenio && window.idUsuarioEdicao) {
        const res = await fetch(`/api/convenios?id=${window.idUsuarioEdicao}`);
        const json = await res.json();
        if (json.sucesso) {
            campoId.value = json.convenio.id;
            campoNome.value = json.convenio.CONVENIO;
        }
    } else {
        const res = await fetch('/api/convenios', { method: 'POST' });
        const json = await res.json();
        if (json.sucesso) {
            campoId.value = json.id;
        } else {
            Swal.fire('Erro no Banco', json.erro, 'error');
        }
    }
}

async function salvarConvenio() {
    const id = document.getElementById('c_id').value;
    const nome = document.getElementById('c_nome').value;
    if(!nome) return Swal.fire('Aviso', 'Preencha o nome do convênio.', 'warning');

    const res = await fetch(`/api/convenios?id=${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ CONVENIO: nome.toUpperCase() })
    });
    if (res.ok) carregarConteudo('convenios.html');
}

async function cancelarConvenio() {
    const id = document.getElementById('c_id').value;
    if (!window.ehEdicaoConvenio && id) await fetch(`/api/convenios?id=${id}`, { method: 'DELETE' });
    carregarConteudo('convenios.html');
}
iniciar();
</script>
