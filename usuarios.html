<div class="row g-3">
    <div class="col-md-2">
        <label class="form-label">ID Profissional</label>
        <input type="number" class="form-control" id="u_id" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Nome Completo</label>
        <input type="text" class="form-control" id="u_nome" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">E-mail (Login)</label>
        <input type="email" class="form-control" id="u_email" required>
    </div>

    <div class="col-md-4">
        <label class="form-label">Perfil de Acesso</label>
        <select class="form-select" id="u_perfil">
            <option value="MEDICO">Médico</option>
            <option value="RECEPCAO">Recepção</option>
            <option value="ADMIN">Administrador</option>
        </select>
    </div>
    <div class="col-md-5">
        <label class="form-label">Especialidade</label>
        <input type="text" class="form-control" id="u_especialidade">
    </div>
    <div class="col-md-3">
        <label class="form-label d-block">Possui Agenda?</label>
        <div class="form-check form-switch mt-2">
            <input class="form-check-input" type="checkbox" id="u_agenda">
            <label class="form-check-label" for="u_agenda">Sim</label>
        </div>
    </div>
</div>
