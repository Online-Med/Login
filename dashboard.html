<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online-Med | Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body { background-color: #f4f7f6; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }
    :root { --sidebar-width: 260px; --sidebar-collapsed: 70px; }
    .sidebar { width: var(--sidebar-width); background: #2c3e50; color: white; display: flex; flex-direction: column; transition: all 0.3s ease; position: relative; z-index: 1000; flex-shrink: 0; }
    .sidebar.minimizada { width: var(--sidebar-collapsed); }
    .sidebar-header { padding: 20px; text-align: center; background: rgba(0,0,0,0.2); white-space: nowrap; overflow: hidden; }
    .btn-toggle-menu { position: absolute; right: 10px; top: 20px; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
    .menu-container { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; justify-content: space-between; }
    .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .header-bar { background: white; padding: 15px 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
    .content-area { padding: 30px; overflow-y: auto; flex-grow: 1; }
    .nav-item { padding: 12px 20px; color: #bdc3c7; text-decoration: none; display: flex; align-items: center; transition: 0.3s; cursor: pointer; justify-content: space-between; }
    .nav-item:hover { background: #34495e; color: white; }
    .minimizada .nav-item span, .minimizada .sidebar-header h4, .minimizada .sidebar-header small, .minimizada .chevron { display: none; }
    .submenu { display: none; background: #1a252f; }
    .nivel-2 { padding: 10px 20px 10px 45px; font-size: 0.9em; color: #95a5a6; cursor: pointer; }
    .nivel-2:hover { color: #3498db; background: #243342; }
    .aberto + .submenu { display: block; }
    .welcome-card { background: white; border-radius: 10px; padding: 50px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .btn-sair { border-top: 1px solid rgba(255,255,255,0.1); color: #e74c3c !important; }
  </style>
</head>
<body>

  <div class="sidebar" id="sidebar">
    <button class="btn-toggle-menu" onclick="toggleMenu()"><i class="bi bi-list"></i></button>
    <div class="sidebar-header">
      <h4 class="mb-0" style="cursor:pointer" onclick="location.reload()">Online-Med</h4>
      <small class="text-info">Gestão de Consultórios</small>
    </div>
    <div class="menu-container">
      <div id="menu-items">
        <div class="text-center p-4"><div class="spinner-border spinner-border-sm text-light"></div></div>
      </div>
      <div class="nav-item btn-sair" onclick="fazerLogout()">
        <div><i class="bi bi-box-arrow-left me-2"></i><span>Sair</span></div>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="header-bar">
      <h5 id="titulo-topo" class="m-0 text-secondary">VISÃO GERAL</h5>
      <div id="user-display"><i class="bi bi-person-circle me-2"></i> Carregando...</div>
    </div>
    <div class="content-area" id="corpo-paginas">
      <div class="welcome-card">
        <i class="bi bi-shield-check text-primary" style="font-size: 4rem;"></i>
        <h3 class="mt-3">Bem-vindo!</h3>
        <p class="text-muted">Seu sistema está pronto. Use o menu ao lado para gerenciar seus pacientes e agendamentos.</p>
      </div>
    </div>
  </div>

<script>
  window.onload = function() {
    verificarSessao();
    _instalarInterceptorFetch(); // injeta x-user-email em todas as chamadas /api/
    carregarMenu();
  };

  // ── Interceptor global de fetch ──────────────────────────────────
  // Adiciona automaticamente o header x-user-email em TODA chamada
  // para /api/... sem precisar alterar cada página HTML.
  function _instalarInterceptorFetch() {
    const _fetchOriginal = window.fetch;
    window.fetch = function(url, options = {}) {
      const urlStr = typeof url === 'string' ? url : (url.url || '');
      if (urlStr.startsWith('/api/')) {
        const email = localStorage.getItem('onlineMed_email') || '';
        options.headers = Object.assign({}, options.headers || {}, {
          'x-user-email': email
        });
      }
      return _fetchOriginal.call(this, url, options);
    };
  }

  function verificarSessao() {
    const usuario = localStorage.getItem('onlineMed_usuario');
    if (!usuario) {
      window.location.href = 'index.html'; // Volta para o login se não houver sessão
      return;
    }
    document.getElementById('user-display').innerHTML = '<i class="bi bi-person-circle me-2"></i> ' + usuario;
  }

  async function carregarMenu() {
    try {
      const resp = await fetch('/api/menu');
      const dados = await resp.json();
      renderizarMenu(dados);
    } catch (err) {
      console.error("Erro ao carregar menu:", err);
    }
  }

  function renderizarMenu(dados) {
    const container = document.getElementById('menu-items');
    if (!dados || !dados.length) {
      container.innerHTML = '<p class="text-muted small text-center p-3">Sem itens de menu.</p>';
      return;
    }
    let html = '';
    const pais = dados.filter(item => !String(item.ordem).includes('.'));
    
    pais.forEach(pai => {
      const filhos = dados.filter(item => String(item.ordem).startsWith(pai.ordem + '.'));
      const temFilhos = filhos.length > 0;
      const acaoPai = temFilhos ? `onclick="toggleSubmenu(this)"` : `onclick="carregarConteudo('${pai.pagina}')"`;

html += `
  <div class="menu-grupo">
    <div class="nav-item" ${acaoPai}>
      <div>
        <i class="bi ${pai.icone || 'bi-folder2'} me-2 text-info"></i>
        <span>${pai.descricao}</span>
      </div>
      ${temFilhos ? '<i class="bi bi-chevron-down chevron"></i>' : ''}
    </div>`;

      if (temFilhos) {
        html += '<div class="submenu">';
        filhos.forEach(f => {
          html += `<div class="nivel-2" onclick="carregarConteudo('${f.pagina}')"><i class="bi bi-dot me-1"></i> ${f.descricao}</div>`;
        });
        html += '</div>';
      }
      html += '</div>';
    });
    container.innerHTML = html;
  }

  function toggleSubmenu(elemento) {
    elemento.classList.toggle('aberto');
  }

  function toggleMenu() {
    document.getElementById('sidebar').classList.toggle('minimizada');
  }

  async function carregarConteudo(pagina) {
    if (!pagina) return;
    const principal = document.getElementById('corpo-paginas');
    principal.innerHTML = '<div class="text-center mt-5"><div class="spinner-border text-info"></div><br>Carregando...</div>';

    try {
      const resp = await fetch(pagina); // Vercel serve arquivos .html diretamente
      if (!resp.ok) throw new Error("Página não encontrada");
      const html = await resp.text();
      
      principal.innerHTML = html;

      // Executa scripts da página carregada
      Array.from(principal.getElementsByTagName('script')).forEach(s => {
        const novo = document.createElement('script');
        novo.text = s.innerHTML;
        document.body.appendChild(novo).parentNode.removeChild(novo);
      });

      // Ajustes de título conforme a página
      const titulos = { 'pacientes.html': 'PACIENTES', 'agenda.html': 'AGENDA MÉDICA', 'atendimento.html': 'ATENDIMENTO', 'prontuario.html': 'PRONTUÁRIO' };
      document.getElementById('titulo-topo').innerText = titulos[pagina] || 'CONSULTÓRIO';

    } catch (err) {
      principal.innerHTML = `<div class="alert alert-danger m-4">Erro ao carregar: ${err.message}</div>`;
    }
  }

// Função global para abrir modais do Bootstrap 5
window.abrirModal = function(idModal) {
    const elemento = document.getElementById(idModal);
    if (elemento) {
        const meuModal = new bootstrap.Modal(elemento);
        meuModal.show();
    } else {
        console.error("Modal não encontrado: " + idModal);
    }
};


  // Função global para fechar modais do Bootstrap 5
window.fecharModal = function(idModal) {
    const elemento = document.getElementById(idModal);
    if (elemento) {
        // Pega a instância existente do modal ou cria uma nova para poder fechar
        const instancia = bootstrap.Modal.getOrCreateInstance(elemento);
        instancia.hide();
        
        // Limpeza extra: remove o fundo escuro (backdrop) se ele travar
        const backdrop = document.querySelector('.modal-backdrop');
        if (backdrop) {
            backdrop.remove();
            document.body.classList.remove('modal-open');
            document.body.style.overflow = '';
            document.body.style.paddingRight = '';
        }
    } else {
        console.error("Modal não encontrado para fechar: " + idModal);
    }
};

  
  function fazerLogout() {
    localStorage.clear();
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
