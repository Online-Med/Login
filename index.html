<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online-Med | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body, html { height: 100%; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
    .login-container { height: 100vh; display: flex; }
    .login-form-side { flex: 1; display: flex; align-items: center; justify-content: center; background: white; }
    .login-image-side { flex: 1.2; background: url('https://images.unsplash.com/photo-1576091160550-2173dba999ef?auto=format&fit=crop&w=1000&q=80') center/cover; }
    .form-box { width: 100%; max-width: 400px; padding: 20px; text-align: center; }
    .btn-entrar { background-color: #0089a5; color: white; border: none; padding: 12px; border-radius: 5px; transition: 0.3s; }
    .btn-entrar:hover { background-color: #006d84; color: white; }
    #erro { color: #dc3545; display: none; margin-top: 15px; font-weight: 500; font-size: 0.9rem; }
    .loader { display: none; margin-top: 10px; width: 1.5rem; height: 1.5rem; }
    .input-group-text { background-color: #f8f9fa; border-right: none; }
    .form-control { border-left: none; }
    .form-control:focus { border-color: #dee2e6; box-shadow: none; }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-form-side">
    <div class="form-box">
      <h2 style="font-weight: bold; color: #333;">Online-Med</h2>
      <p class="text-muted">Saúde Consultórios <span class="badge bg-info">V 1.2.2026</span></p>
      
      <div class="mt-4">
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="email" id="email" class="form-control" placeholder="E-mail">
        </div>
        
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" id="senha" class="form-control" placeholder="Senha">
        </div>
        
        <div class="text-end mb-3">
          <a href="#" class="text-decoration-none small" style="color: #0089a5;" onclick="recuperarSenha()">Esqueceu sua senha?</a>
        </div>
        
        <button class="btn btn-entrar w-100" id="btnAcao" onclick="fazerLogin()">Entrar</button>
        
        <div id="erro"></div>
        <div class="loader spinner-border text-info" role="status"></div>
      </div>
      
      <div class="mt-5 text-muted small">
        <i class="bi bi-shield-check"></i> Protegido por Online-Med
      </div>
    </div>
  </div>

  <div class="login-image-side d-none d-md-block"></div>
</div>

<script>
// --- FUNÇÃO DE LOGIN ---
async function fazerLogin() {
  const email = document.getElementById('email').value;
  const senha = document.getElementById('senha').value;
  const btn = document.getElementById('btnAcao');
  const erroDiv = document.getElementById('erro');
  const loader = document.querySelector('.loader');
  
  if (!email || !senha) {
    exibirErro("Preencha todos os campos.");
    return;
  }

  setLoading(true);

  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, senha: senha })
    });

    const dados = await response.json();

    if (response.ok && dados.sucesso) {
      localStorage.setItem('onlineMed_usuario', dados.usuario);
      localStorage.setItem('onlineMed_email', email);
      localStorage.setItem('onlineMed_token', btoa(email + ":" + new Date().getTime()));
      window.location.href = "dashboard.html";
    } else {
      exibirErro(dados.mensagem || "Usuário ou senha inválidos.");
    }
  } catch (err) {
    exibirErro("Erro ao conectar com o servidor.");
    console.error(err);
  } finally {
    setLoading(false);
  }
}

// --- FUNÇÃO DE RECUPERAÇÃO DE SENHA ---
async function recuperarSenha() {
  const email = document.getElementById('email').value;
  const erroDiv = document.getElementById('erro');
  
  if (!email) {
    exibirErro("Digite seu e-mail no campo acima para recuperar a senha.");
    return;
  }

  // Feedback visual simples
  const originalLinkColor = "#0089a5";
  exibirErro("Processando recuperação..."); 
  erroDiv.style.color = "#0089a5"; // Muda cor para azul (informativo)

  try {
    const response = await fetch('/api/recuperar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    });

    const res = await response.json();

    if (res.sucesso) {
      alert("Sucesso! Uma nova senha temporária foi enviada para o seu e-mail.");
      erroDiv.style.display = 'none';
    } else {
      exibirErro(res.mensagem || "Erro ao solicitar nova senha.");
      erroDiv.style.color = "#dc3545"; // Volta para vermelho (erro)
    }
  } catch (err) {
    exibirErro("Erro ao conectar com o serviço de e-mail.");
    erroDiv.style.color = "#dc3545";
  }
}

// --- HELPERS ---
function exibirErro(msg) {
  const erroDiv = document.getElementById('erro');
  erroDiv.innerText = msg;
  erroDiv.style.display = 'block';
}

function setLoading(isLoading) {
  const btn = document.getElementById('btnAcao');
  const erroDiv = document.getElementById('erro');
  const loader = document.querySelector('.loader');
  
  btn.disabled = isLoading;
  if (isLoading) {
    if (erroDiv) erroDiv.style.display = 'none';
    if (loader) loader.style.display = 'inline-block';
  } else {
    if (loader) loader.style.display = 'none';
  }
}

document.addEventListener('keypress', function (e) {
  if (e.key === 'Enter') fazerLogin();
});
</script>

</body>
</html>
