<div class="container-fluid mt-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><i class="bi bi-house"></i> INÍCIO</li>
        <li class="breadcrumb-item"><a style="cursor:pointer; color:#0d6efd; text-decoration:underline;" onclick="cancelarCadastro()">pacientes</a></li>
        <li class="breadcrumb-item active">CADASTRO</li>
      </ol>
    </nav>
    <div>
      <button class="btn btn-secondary btn-sm me-2" onclick="cancelarCadastro()">Cancelar</button>
      <button class="btn btn-info text-white btn-sm" onclick="salvarNovoPaciente()">
        <i class="bi bi-check-lg"></i> Salvar Registro
      </button>
    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body">
      <form id="formCadastro">
        <h6 class="text-info border-bottom pb-2 mb-3">Identificação</h6>
        <div class="row g-2 mb-4">
          <div class="col-md-2 text-center">
            <div class="border rounded bg-light d-flex align-items-center justify-content-center" style="height: 120px;">
              <i class="bi bi-camera fs-1 text-muted"></i>
            </div>
            <small class="text-muted">Foto do Paciente</small>
          </div>
          <div class="col-md-10">
            <div class="row g-2">
              <div class="col-md-2">
                <label class="small fw-bold">PCOD</label>
                <input type="text" class="form-control form-control-sm bg-light" name="pcod" id="f_pcod" placeholder="Carregando..." readonly>
              </div>
              <div class="col-md-10">
                <label class="small fw-bold">Nome Completo *</label>
                <input type="text" class="form-control form-control-sm" name="Nome" required>
              </div>
              
              <div class="col-md-6">
                <label class="small fw-bold">Responsável (se houver)</label>
                <input type="text" class="form-control form-control-sm" name="Responsavel" placeholder="Nome do responsável legal">
              </div>
              <div class="col-md-6">
                <label class="small fw-bold">Indicação</label>
                <input type="text" class="form-control form-control-sm" name="indicacao" placeholder="Quem indicou?">
              </div>

              <div class="col-md-4">
                <label class="small fw-bold">Sexo</label>
                <select class="form-select form-select-sm" name="Sexo">
                  <option value="Masculino">Masculino</option>
                  <option value="Feminino">Feminino</option>
                  <option value="Outros">Outros</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="small fw-bold">Data Nascimento</label>
                <input type="date" class="form-control form-control-sm" name="Data_Nascimento">
              </div>
              <div class="col-md-4">
                <label class="small fw-bold">Estado Civil</label>
                <select class="form-select form-select-sm" name="Estado_Civil">
                  <option>Solteiro(a)</option><option>Casado(a)</option>
                  <option>Divorciado(a)</option><option>Viuvo(a)</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <h6 class="text-info border-bottom pb-2 mb-3">Documentação e Contato</h6>
        <div class="row g-2 mb-4">
          <div class="col-md-3"><label class="small fw-bold">CPF</label><input type="text" class="form-control form-control-sm" name="Documento" id="cpf"></div>
          <div class="col-md-3"><label class="small fw-bold">RG</label><input type="text" class="form-control form-control-sm" name="rg"></div>
          <div class="col-md-3"><label class="small fw-bold">Telefone</label><input type="text" class="form-control form-control-sm" name="Telefone"></div>
          <div class="col-md-3"><label class="small fw-bold">Celular</label><input type="text" class="form-control form-control-sm" name="Celular"></div>
          <div class="col-md-6"><label class="small fw-bold">E-mail</label><input type="email" class="form-control form-control-sm" name="Email"></div>
          <div class="col-md-6"><label class="small fw-bold">Convênio</label><select class="form-select form-select-sm" name="Convenio" id="comboConvenios"><option>Carregando...</option></select></div>
        </div>

        <h6 class="text-info border-bottom pb-2 mb-3">Endereço</h6>
        <div class="row g-2 mb-2">
          <div class="col-md-3 col-lg-2">
            <label class="small fw-bold">CEP</label>
            <input type="text" class="form-control form-control-sm" name="CEP" onblur="buscarEndereco(this.value)">
          </div>
          <div class="col-md-9 col-lg-10">
            <label class="small fw-bold">Endereço (Rua)</label>
            <input type="text" class="form-control form-control-sm" name="Endereco" id="rua">
          </div>
        </div>

        <div class="row g-2 mb-2">
          <div class="col-md-3 col-lg-2">
            <label class="small fw-bold">Número</label>
            <input type="text" class="form-control form-control-sm" name="Numero">
          </div>
          <div class="col-md-5 col-lg-6">
            <label class="small fw-bold">Complemento</label>
            <input type="text" class="form-control form-control-sm" name="Complemento">
          </div>
          <div class="col-md-4 col-lg-4">
            <label class="small fw-bold">Bairro</label>
            <input type="text" class="form-control form-control-sm" name="Bairro" id="bairro">
          </div>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-md-10 col-lg-10">
            <label class="small fw-bold">Cidade</label>
            <input type="text" class="form-control form-control-sm" name="Cidade" id="cidade">
          </div>
          <div class="col-md-2 col-lg-2">
            <label class="small fw-bold">Estado</label>
            <input type="text" class="form-control form-control-sm" name="Estado" id="uf">
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  // Usamos var para permitir a reinicialização se a página for carregada via Ajax
  var ehEdicao = false;

  function buscarEndereco(cep) {
    const limpo = cep.replace(/\D/g, '');
    if (limpo.length !== 8) return;
    fetch('https://viacep.com.br/ws/' + limpo + '/json/')
      .then(r => r.json())
      .then(d => {
        if (!d.erro) {
          document.getElementById('rua').value = d.logradouro;
          document.getElementById('bairro').value = d.bairro;
          document.getElementById('cidade').value = d.localidade;
          document.getElementById('uf').value = d.uf;
        }
      });
  }

  async function carregarConvenios(valorAtual) {
    try {
      const resp = await fetch('/api/convenios');
      const lista = await resp.json();
      const combo = document.getElementById('comboConvenios');
      if (!combo) return;
      combo.innerHTML = '<option value="">Selecione...</option>';
      if (lista && lista.length > 0) {
        lista.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.CONVENIO;
          opt.textContent = c.CONVENIO;
          combo.appendChild(opt);
        });
      }
      if (valorAtual) combo.value = valorAtual;
    } catch (err) { console.error(err); }
  }

  // Inicialização
  (async function inicializarCadastro() {
    await carregarConvenios();
    const inputPcod = document.getElementById('f_pcod');
    
    // Pequeno atraso para detectar se o dashboard já preencheu o PCOD (caso de edição)
    setTimeout(async () => {
      if (inputPcod && (inputPcod.value === "" || inputPcod.value === "Carregando...")) {
        ehEdicao = false; 
        try {
          const resp = await fetch('/api/pacientes', { method: 'POST' });
          const data = await resp.json();
          if (data.sucesso) { inputPcod.value = data.pcod; }
        } catch (err) { console.error("Erro reserva:", err); }
      } else {
        ehEdicao = true;
        console.log("Modo edição ativado para PCOD:", inputPcod.value);
      }
    }, 200);
  })();

  async function salvarNovoPaciente() {
    const form = document.getElementById('formCadastro');
    const pcodReal = document.getElementById('f_pcod')?.value;
    if (!pcodReal || pcodReal === "Carregando...") return;

    const formData = new FormData(form);
    let dadosRaw = Object.fromEntries(formData);

    let dadosParaSalvar = {
      Nome: dadosRaw.Nome,
      Sexo: dadosRaw.Sexo,
      Estado_Civil: dadosRaw.Estado_Civil,
      Telefone: dadosRaw.Telefone,
      Email: dadosRaw.Email,
      CEP: dadosRaw.CEP,
      Endereco: dadosRaw.Endereco,
      Numero: dadosRaw.Numero,
      Bairro: dadosRaw.Bairro,
      Cidade: dadosRaw.Cidade,
      UF: dadosRaw.Estado,
      Documento: dadosRaw.Documento,
      rg: dadosRaw.rg,
      Celular: dadosRaw.Celular,
      Convenio: dadosRaw.Convenio,
      indicacao: dadosRaw.indicacao,
      Responsavel: dadosRaw.Responsavel,
      Data_Nascimento: dadosRaw.Data_Nascimento
    };

    Object.keys(dadosParaSalvar).forEach(key => { if (!dadosParaSalvar[key]) delete dadosParaSalvar[key]; });

    Swal.fire({ title: 'Salvando...', didOpen: () => Swal.showLoading() });

    try {
      const resp = await fetch(`/api/pacientes?pcod=${pcodReal}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dadosParaSalvar)
      });
      const res = await resp.json();
      if (res.sucesso) {
        Swal.fire('Sucesso!', 'Paciente salvo!', 'success').then(() => carregarConteudo('pacientes.html'));
      }
    } catch (err) { Swal.fire('Erro', 'Falha ao salvar.', 'error'); }
  }

  async function cancelarCadastro() {
    const pcod = document.getElementById('f_pcod').value;
    const nome = document.getElementsByName('Nome')[0]?.value || "";

    // SÓ apaga se ehEdicao for FALSE E o nome ainda for de reserva
    if (ehEdicao === false && pcod && pcod !== "Carregando..." && nome.includes("RESERVADO")) {
      try {
        await fetch(`/api/pacientes?pcod=${pcod}`, { method: 'DELETE' });
      } catch (err) { console.error(err); }
    }
    carregarConteudo('pacientes.html');
  }
</script>
