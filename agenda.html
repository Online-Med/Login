<!-- agenda.html — Fragmento carregado via carregarConteudo() no dashboard -->
<style>
:root { --slot-h: 58px; --col-hora: 68px; }

#toolbarAgenda {
  background:#fff; border-bottom:1px solid #e9ecef;
  padding:8px 14px; display:flex; flex-wrap:wrap;
  gap:8px; align-items:center;
}
#toolbarAgenda h5 { margin:0; font-size:.95rem; }

#gradeAgenda { overflow-y:auto; max-height:72vh; }

.ag-table { width:100%; border-collapse:collapse; table-layout:fixed; }
.ag-table th {
  background:#f8f9fa; font-size:.72rem; text-transform:uppercase;
  letter-spacing:.04em; color:#6c757d; padding:7px 10px;
  position:sticky; top:0; z-index:4; border-bottom:2px solid #dee2e6;
}
.ag-table td { padding:3px 5px; border-bottom:1px solid #f2f2f2; vertical-align:middle; }
.ag-row { height:var(--slot-h); }
.col-hora {
  width:var(--col-hora); text-align:center; font-weight:700;
  font-size:.82rem; color:#495057; background:#fafafa;
  border-right:2px solid #dee2e6;
}
.hora-cheia td  { border-top:1px solid #d8e8fb; }
.hora-cheia .col-hora { color:#0d6efd; border-right-color:#0d6efd; }
.fora-exp { opacity:.38; pointer-events:none; }
.fora-exp .col-hora { color:#adb5bd; }
.bloq-row { background:repeating-linear-gradient(45deg,#fff8e1,#fff8e1 5px,#fffde7 5px,#fffde7 10px)!important; }

.slot-vazio {
  display:flex; align-items:center; gap:5px;
  color:#20c997; font-size:.8rem; cursor:pointer;
  padding:5px 8px; border-radius:5px; transition:background .1s;
}
.slot-vazio:hover { background:#e6fdf6; }

/* Cards */
.ag-card {
  display:flex; align-items:center; gap:5px;
  background:#fff; border-radius:5px; border-left:4px solid #adb5bd;
  padding:4px 7px; font-size:.79rem;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
  cursor:grab; user-select:none;
}
.ag-card.dragging  { opacity:.25; }
.s-AGUARDANDO      { border-left-color:#ffc107; }
.s-EM_ATENDIMENTO  { border-left-color:#0d6efd; }
.s-ATENDIDO        { border-left-color:#198754; background:#f6fdf9; }
.s-FALTA           { border-left-color:#dc3545; background:#fff7f7; }
.s-CANCELADO       { border-left-color:#6c757d; background:#f9f9f9; opacity:.7; }
.ag-card.encaixe   { background:#eff4ff; border-left-color:#4361ee; }
.drop-ok           { background:#e7f5ff !important; }

/* Timer */
.tpill {
  display:inline-flex; align-items:center; gap:2px;
  background:#fff3cd; color:#856404;
  border-radius:20px; padding:1px 6px; font-size:.67rem; font-weight:600;
}
.tpill.longo { background:#f8d7da; color:#842029; }

/* Sidebar */
.stat-card {
  border-radius:8px; padding:9px 12px; margin-bottom:7px;
  display:flex; justify-content:space-between; align-items:center;
}
.stat-card .num { font-size:1.3rem; font-weight:700; }
.stat-card .lbl { font-size:.72rem; color:#6c757d; }
.espera-item {
  display:flex; justify-content:space-between; align-items:center;
  padding:5px 0; border-bottom:1px solid #f0f0f0; font-size:.8rem;
}
.espera-item:last-child { border-bottom:none; }

/* Badges especiais */
.b1v  { background:#fff3cd; color:#664d03; font-size:.64rem; font-weight:700; }
.bonl { background:#cfe2ff; color:#084298; font-size:.64rem; }
.bpre { background:#e2e3e5; color:#41464b; font-size:.64rem; }

/* Dropdown busca */
#agDropdownBusca {
  position:absolute; z-index:1070; background:#fff;
  border:1px solid #dee2e6; border-radius:6px;
  box-shadow:0 4px 14px rgba(0,0,0,.13);
  max-height:200px; overflow-y:auto; min-width:320px; left:0;
}
#agDropdownBusca .dbi {
  font-size:.81rem; cursor:pointer;
  padding:8px 12px; border-bottom:1px solid #f5f5f5;
}
#agDropdownBusca .dbi:hover { background:#f0f4ff; }
#agDropdownBusca .dbi:last-child { border-bottom:none; }

/* Shimmer */
.slot-loading {
  height:22px; border-radius:4px; width:80%;
  background:linear-gradient(90deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);
  background-size:200%;
  animation:shimmer 1.2s infinite;
}
@keyframes shimmer { 0%{background-position:200%} 100%{background-position:-200%} }
</style>

<!-- ═══ SCRIPT ═══════════════════════════════════════════════════ -->
<script>
(function() {
// ── Namespace para não poluir o escopo global do dashboard ───────
const AG = window._AG = {};

// ── Estado ───────────────────────────────────────────────────────
AG.cfg      = { inicio:'08:00', fim:'18:00', intervalo:15, diasOk:[1,2,3,4,5] };
AG.dados    = [];   // agendamentos do dia carregados
AG.horaSel  = '';
AG.dragId   = null;
AG.timerInt = null;
AG.buscaTmr = null;

// Mapa de abreviações BR → getDay()
const DIAS_MAP = { DOM:0, SEG:1, TER:2, QUA:3, QUI:4, SEX:5, SAB:6 };

// ── FIX MODAL: move modais para document.body ─────────────────────
// Sem isso ficam presos no overflow do #corpo-paginas
['agModalAg','agModalBlq','agModalEnc'].forEach(function(id) {
  var el = document.getElementById(id);
  if (el && el.parentNode !== document.body) document.body.appendChild(el);
});

// ── Utilitários ──────────────────────────────────────────────────
function pm(h)   { var p=h.split(':'); return +p[0]*60+ +p[1]; }
function fh(m)   { return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function esc(s)  { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function brDate(iso) { if(!iso)return''; var p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function minEsp(iso) { return Math.floor((new Date()-new Date(iso))/60000); }
function fmtEsp(iso) {
  var m=minEsp(iso);
  if(m<1)  return 'Agora';
  if(m<60) return m+'min';
  return Math.floor(m/60)+'h'+(m%60?m%60+'min':'');
}

// ── Helpers modal (usa Bootstrap JS do dashboard) ────────────────
function abrirModal(id) {
  var el=document.getElementById(id);
  if(!el) return;
  if(el.parentNode!==document.body) document.body.appendChild(el);
  bootstrap.Modal.getOrCreateInstance(el).show();
}
function fecharModal(id) {
  var el=document.getElementById(id); if(!el) return;
  var m=bootstrap.Modal.getInstance(el); if(m) m.hide();
  setTimeout(function(){
    document.querySelectorAll('.modal-backdrop').forEach(function(b){ b.remove(); });
    document.body.classList.remove('modal-open');
    document.body.style.overflow='';
    document.body.style.paddingRight='';
  }, 200);
}

// ── API helper ───────────────────────────────────────────────────
async function api(params, method, body) {
  var qs = Object.entries(params).map(function(p){ return p[0]+'='+encodeURIComponent(p[1]); }).join('&');
  var opts = { method: method||'GET', headers:{'Content-Type':'application/json'} };
  if(body) opts.body = JSON.stringify(body);
  var r = await fetch('/api/agenda?'+qs, opts);
  return r.json();
}

// ── INICIALIZAÇÃO ────────────────────────────────────────────────
async function inicializarAgenda() {
  var camp = document.getElementById('agData');
  if(camp && !camp.value) camp.value = new Date().toISOString().split('T')[0];
  _atualizarLabelDia();

  if(AG.timerInt) clearInterval(AG.timerInt);
  AG.timerInt = setInterval(_atualizarTimers, 30000);

  // Carrega profissionais
  var lista = await api({action:'profissionais'});
  var sel = document.getElementById('agProfissional');
  if(!lista||!lista.length){ sel.innerHTML='<option>Sem profissionais</option>'; return; }
  sel.innerHTML = lista.map(function(p){
    return '<option value="'+p.id_profissional+'">'+esc(p.nome)+'</option>';
  }).join('');
  await _carregarConfig();
}

// Expõe para o dashboard.html chamar como inicializarPaginaAgenda
window.inicializarPaginaAgenda = inicializarAgenda;

async function agAoTrocarProf() { await _carregarConfig(); }
async function agAoTrocarData() { _atualizarLabelDia(); _renderGradeVazia(); await _carregarDados(); }
window.agAoTrocarProf = agAoTrocarProf;
window.agAoTrocarData = agAoTrocarData;

function agMudarDia(d) {
  var c=document.getElementById('agData');
  var dt=new Date(c.value+'T12:00:00'); dt.setDate(dt.getDate()+d);
  c.value=dt.toISOString().split('T')[0]; agAoTrocarData();
}
window.agMudarDia = agMudarDia;

function _atualizarLabelDia() {
  var c=document.getElementById('agData'); if(!c||!c.value) return;
  var dias=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  var el=document.getElementById('agLabelDia');
  if(el) el.textContent=dias[new Date(c.value+'T12:00:00').getDay()];
}

async function _carregarConfig() {
  var id=document.getElementById('agProfissional').value;
  if(!id) return;
  var c = await api({action:'config', id_profissional:id});

  // Parseia dias: "SEG:TER:QUA:QUI:SEX:SAB" → [1,2,3,4,5,6]
  var diasStr = c.dias_agenda || 'SEG:TER:QUA:QUI:SEX:SAB';
  var diasOk  = diasStr.split(':').map(function(d){ return DIAS_MAP[d.toUpperCase()]; }).filter(function(d){ return d!==undefined; });

  AG.cfg = {
    inicio:    c.horario_inicio_agenda || '08:00',
    fim:       c.horario_fim_agenda    || '17:00',
    intervalo: parseInt(c.tempo_agenda)||15,
    diasOk:    diasOk.length ? diasOk : [1,2,3,4,5]
  };

  _renderGradeVazia();   // FASE 1 — imediato
  await _carregarDados(); // FASE 2 — background
}

// ── FASE 1: Grade vazia — instantânea ────────────────────────────
function _renderGradeVazia() {
  var dataVal = document.getElementById('agData').value;
  var diaSem  = new Date(dataVal+'T12:00:00').getDay();
  var diaOk   = AG.cfg.diasOk.indexOf(diaSem) !== -1;
  document.getElementById('agAlertaDia').classList.toggle('d-none', diaOk);

  // Grade completa 07:00–20:00 mas fora do range do profissional fica travada
  var GRADE_INI = pm('07:00'), GRADE_FIM = pm('20:00');
  var cfgIni = pm(AG.cfg.inicio), cfgFim = pm(AG.cfg.fim);
  var inv = AG.cfg.intervalo;

  var buf = ['<table class="ag-table">'
    +'<thead><tr>'
    +'<th style="width:var(--col-hora)">Hora</th>'
    +'<th>Paciente / Status</th>'
    +'</tr></thead><tbody>'];

  for(var m=GRADE_INI; m<=GRADE_FIM; m+=inv) {
    var h     = fh(m);
    var fora  = !diaOk || m<cfgIni || m>cfgFim;
    var cheia = (m%60===0);
    var trCls = 'ag-row'+(fora?' fora-exp':'')+(cheia&&!fora?' hora-cheia':'');
    var slotId= 'agS-'+h.replace(':','-');
    buf.push(
      '<tr class="'+trCls+'" data-hora="'+h+'"'
      +' ondragover="window._AG.onDragOver(event)" ondrop="window._AG.onDrop(event,\''+h+'\')">'
      +'<td class="col-hora">'+h+'</td>'
      +'<td id="'+slotId+'">'
      +(fora
        ? '<span class="text-muted" style="font-size:.75rem"><i class="bi bi-calendar-x"></i> Indisponível</span>'
        : '<div class="slot-vazio" onclick="window._AG.abrirModalAg(\''+h+'\')">'
          +'<i class="bi bi-plus-circle-fill"></i> Disponível</div>')
      +'</td></tr>'
    );
  }
  buf.push('</tbody></table>');
  document.getElementById('gradeAgenda').innerHTML = buf.join('');
}

// ── FASE 2: Busca dados e preenche slots ─────────────────────────
async function _carregarDados() {
  var id  = document.getElementById('agProfissional').value;
  var dt  = document.getElementById('agData').value;
  if(!id||!dt) return;

  // Shimmer enquanto aguarda
  document.querySelectorAll('#gradeAgenda .slot-vazio').forEach(function(el){
    el.outerHTML = '<div class="slot-loading"></div>';
  });

  AG.dados = await api({action:'dia', id_profissional:id, data:dt});
  _preencherSlots();
  _atualizarContadores();
  _atualizarEspera();
}

function _preencherSlots() {
  var GRADE_INI=pm('07:00'), GRADE_FIM=pm('20:00'), inv=AG.cfg.intervalo;
  var cfgIni=pm(AG.cfg.inicio), cfgFim=pm(AG.cfg.fim);

  for(var m=GRADE_INI; m<=GRADE_FIM; m+=inv) {
    var h    = fh(m);
    var cell = document.getElementById('agS-'+h.replace(':','-'));
    if(!cell) continue;
    var tr   = cell.parentElement;
    var fora = tr.classList.contains('fora-exp') || m<cfgIni || m>cfgFim;

    var ags  = AG.dados.filter(function(a){ return a.hora_agenda===h&&!a.is_encaixe&&!a.is_bloqueado; });
    var encs = AG.dados.filter(function(a){ return a.hora_agenda===h&&!!a.is_encaixe; });
    var bloq = AG.dados.filter(function(a){ return a.hora_agenda===h&&!!a.is_bloqueado; });

    var html='';
    if(bloq.length) {
      tr.classList.add('bloq-row');
      bloq.forEach(function(b){ html+=_renderBloq(b); });
    } else {
      tr.classList.remove('bloq-row');
      if(ags.length) {
        ags.forEach(function(a){ html+=_renderCard(a); });
      } else {
        html = fora
          ? '<span class="text-muted" style="font-size:.75rem"><i class="bi bi-calendar-x"></i> Indisponível</span>'
          : '<div class="slot-vazio" onclick="window._AG.abrirModalAg(\''+h+'\')">'
            +'<i class="bi bi-plus-circle-fill"></i> Disponível</div>';
      }
    }
    encs.forEach(function(e){ html+=_renderCard(e); });
    cell.innerHTML = html;
  }
}

// ── Render card ──────────────────────────────────────────────────
function _renderCard(ag) {
  var st = ag.status||'AGUARDANDO';
  var corMap = {AGUARDANDO:'warning',EM_ATENDIMENTO:'primary',ATENDIDO:'success',FALTA:'danger',CANCELADO:'secondary'};
  var stLbl  = {AGUARDANDO:'⏳ Aguardando',EM_ATENDIMENTO:'▶ Atendendo',ATENDIDO:'✓ Atendido',FALTA:'✗ Faltou',CANCELADO:'— Cancelado'};

  // Timer de espera
  var espPill='';
  if(ag.hora_chegada&&(st==='AGUARDANDO'||st==='EM_ATENDIMENTO')) {
    var min=minEsp(ag.hora_chegada);
    espPill='<span class="tpill'+(min>30?' longo':'')+'" data-chegada="'+ag.hora_chegada+'">'
      +'<i class="bi bi-clock"></i> '+fmtEsp(ag.hora_chegada)+'</span>';
  }

  // Botão WhatsApp
  var btnWpp='';
  var tel=(ag.telefone_whatsapp||'').replace(/\D/g,'');
  if(tel) {
    var msg=encodeURIComponent(
      'Olá '+esc(ag.paciente_nome||'')+', sua consulta está agendada para '
      +brDate(ag.data_agenda)+' às '+ag.hora_agenda
      +'. Por favor, confirme seu comparecimento. Obrigado!'
    );
    btnWpp='<a href="https://wa.me/55'+tel+'?text='+msg+'" target="_blank" '
      +'class="btn btn-success btn-sm p-1 me-1" onclick="event.stopPropagation()" title="Enviar confirmação">'
      +'<i class="bi bi-whatsapp"></i></a>';
  } else {
    btnWpp='<button class="btn btn-outline-secondary btn-sm p-1 me-1" '
      +'onclick="event.stopPropagation();alert(\'Celular não cadastrado para este paciente.\')" '
      +'title="Sem celular">'
      +'<i class="bi bi-whatsapp text-muted"></i></button>';
  }

  // Badges
  var badges='';
  if(ag.is_encaixe)        badges+='<span class="badge bg-primary ms-1" style="font-size:.6rem">ENC</span>';
  if(ag.primeira_consulta) badges+='<span class="badge b1v ms-1"><i class="bi bi-star-fill"></i> 1ª VEZ</span>';
  if(ag.modalidade==='ONLINE') badges+='<span class="badge bonl ms-1"><i class="bi bi-camera-video"></i> Online</span>';
  else                         badges+='<span class="badge bpre ms-1"><i class="bi bi-building"></i> Pres.</span>';

  var horaAten = ag.hora_atendido
    ? '<div style="font-size:.65rem;color:#6c757d"><i class="bi bi-check2-all text-success"></i> Encerrado às '
      +new Date(ag.hora_atendido).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</div>' : '';

  return '<div class="ag-card s-'+st+(ag.is_encaixe?' encaixe':'')+'" draggable="true" '
    +'ondragstart="window._AG.onDragStart(event,'+ag.id+')" ondragend="window._AG.onDragEnd(event)">'
    // grip
    +'<span style="color:#adb5bd;flex-shrink:0"><i class="bi bi-grip-vertical"></i></span>'
    // corpo
    +'<div class="flex-grow-1 overflow-hidden">'
      +'<div class="d-flex align-items-center flex-wrap gap-1">'
        +'<span class="fw-bold text-truncate" style="max-width:160px">'+esc(ag.paciente_nome||'Sem nome')+'</span>'
        +badges
      +'</div>'
      +'<div class="d-flex flex-wrap gap-1 mt-1">'
        +'<span class="badge bg-'+corMap[st]+' text-'+(corMap[st]==='warning'?'dark':'white')+'" style="font-size:.65rem">'+stLbl[st]+'</span>'
        +(ag.tipo?'<span class="badge bg-secondary" style="font-size:.65rem">'+esc(ag.tipo)+'</span>':'')
        +(ag.convenio?'<span class="badge bg-light text-dark border" style="font-size:.65rem">'+esc(ag.convenio)+'</span>':'')
      +'</div>'
      +(espPill?'<div class="mt-1">'+espPill+'</div>':'')
      +horaAten
    +'</div>'
    // ações
    +'<div class="d-flex flex-column align-items-end gap-1 flex-shrink-0">'
      +btnWpp
      +'<div class="dropdown">'
        +'<button class="btn btn-outline-secondary btn-sm p-1" data-bs-toggle="dropdown" '
          +'onclick="event.stopPropagation()" style="line-height:1">'
          +'<i class="bi bi-three-dots-vertical"></i></button>'
        +'<ul class="dropdown-menu dropdown-menu-end" style="font-size:.8rem;min-width:165px">'
          +(!ag.hora_chegada
            ?'<li><a class="dropdown-item" onclick="window._AG.acao(\'chegada\','+ag.id+')">'
              +'<i class="bi bi-door-open text-info"></i> Registrar Chegada</a></li>':'')
          +(st!=='EM_ATENDIMENTO'
            ?'<li><a class="dropdown-item" onclick="window._AG.acao(\'status\','+ag.id+',\'EM_ATENDIMENTO\')">'
              +'<i class="bi bi-person-fill text-primary"></i> Em Atendimento</a></li>':'')
          +(st!=='ATENDIDO'
            ?'<li><a class="dropdown-item" onclick="window._AG.acao(\'atendido\','+ag.id+')">'
              +'<i class="bi bi-check-circle text-success"></i> Marcar Atendido</a></li>':'')
          +(st!=='AGUARDANDO'
            ?'<li><a class="dropdown-item" onclick="window._AG.acao(\'status\','+ag.id+',\'AGUARDANDO\')">'
              +'<i class="bi bi-arrow-counterclockwise text-warning"></i> Aguardando</a></li>':'')
          +'<li><hr class="dropdown-divider my-1"></li>'
          +(st!=='FALTA'
            ?'<li><a class="dropdown-item" onclick="window._AG.acao(\'status\','+ag.id+',\'FALTA\')">'
              +'<i class="bi bi-x-circle text-danger"></i> Faltou</a></li>':'')
          +(st!=='CANCELADO'
            ?'<li><a class="dropdown-item" onclick="window._AG.acao(\'status\','+ag.id+',\'CANCELADO\')">'
              +'<i class="bi bi-slash-circle text-secondary"></i> Cancelar</a></li>':'')
          +'<li><hr class="dropdown-divider my-1"></li>'
          +'<li><a class="dropdown-item text-danger" onclick="window._AG.acao(\'excluir\','+ag.id+')">'
            +'<i class="bi bi-trash"></i> Excluir</a></li>'
        +'</ul>'
      +'</div>'
    +'</div>'
    +'</div>';
}

function _renderBloq(b) {
  return '<div class="d-flex align-items-center gap-2 py-1 px-2 text-muted" style="font-size:.8rem">'
    +'<i class="bi bi-lock-fill text-warning"></i>'
    +'<span class="flex-grow-1"><strong>Bloqueado:</strong> '+esc(b.observacao||'Horário bloqueado')+'</span>'
    +'<button class="btn btn-sm btn-outline-danger border-0 p-1" '
      +'onclick="window._AG.acao(\'desbloquear\','+b.id+')" title="Desbloquear">'
      +'<i class="bi bi-unlock"></i></button>'
    +'</div>';
}

// ── Drag & Drop ──────────────────────────────────────────────────
AG.onDragStart = function(e, id) {
  AG.dragId = id; e.dataTransfer.effectAllowed='move';
  setTimeout(function(){ var c=e.target.closest('.ag-card'); if(c) c.classList.add('dragging'); },0);
};
AG.onDragEnd = function() {
  document.querySelectorAll('.ag-card.dragging,.drop-ok').forEach(function(el){
    el.classList.remove('dragging','drop-ok');
  });
};
AG.onDragOver = function(e) {
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  var tr=e.currentTarget;
  document.querySelectorAll('.drop-ok').forEach(function(el){ if(el!==tr) el.classList.remove('drop-ok'); });
  tr.classList.add('drop-ok');
};
AG.onDrop = async function(e, novaH) {
  e.preventDefault(); e.currentTarget.classList.remove('drop-ok');
  if(!AG.dragId) return;
  var ag = AG.dados.find(function(a){ return a.id==AG.dragId; });
  var id = AG.dragId; AG.dragId=null;
  if(!ag||ag.hora_agenda===novaH) return;
  if(!confirm('Mover "'+esc(ag.paciente_nome||'')+'" de '+ag.hora_agenda+' para '+novaH+'?')) return;
  var r = await api({id:id}, 'PATCH', {hora_agenda:novaH});
  if(r.sucesso) { ag.hora_agenda=novaH; _preencherSlots(); _atualizarEspera(); }
  else alert('Erro: '+(r.erro||'Horário pode estar ocupado.'));
};

// ── Ações de status ──────────────────────────────────────────────
AG.acao = async function(tipo, id, extra) {
  var ag = AG.dados.find(function(a){ return a.id==id; });
  if(!ag) return;
  var body, campos;

  if(tipo==='chegada') {
    var ts=new Date().toISOString();
    body={hora_chegada:ts, status:'AGUARDANDO'};
    campos={hora_chegada:ts, status:'AGUARDANDO'};
  } else if(tipo==='status') {
    body={status:extra};
    campos={status:extra};
  } else if(tipo==='atendido') {
    var ts=new Date().toISOString();
    body={status:'ATENDIDO', hora_atendido:ts};
    campos={status:'ATENDIDO', hora_atendido:ts};
  } else if(tipo==='excluir') {
    if(!confirm('Excluir este agendamento?')) return;
    var r=await api({id:id},'DELETE');
    if(r.sucesso){ AG.dados=AG.dados.filter(function(a){return a.id!=id;}); _preencherSlots(); _atualizarContadores(); _atualizarEspera(); }
    else alert('Erro: '+r.erro);
    return;
  } else if(tipo==='desbloquear') {
    if(!confirm('Desbloquear este horário?')) return;
    var r=await api({id:id},'DELETE');
    if(r.sucesso){ AG.dados=AG.dados.filter(function(a){return a.id!=id;}); _preencherSlots(); }
    return;
  }

  var r=await api({id:id},'PATCH',body);
  if(r.sucesso){ Object.assign(ag,campos); _preencherSlots(); _atualizarContadores(); _atualizarEspera(); }
  else alert('Erro: '+r.erro);
};

// ── Timers ───────────────────────────────────────────────────────
function _atualizarTimers() {
  document.querySelectorAll('.tpill[data-chegada]').forEach(function(el){
    var iso=el.getAttribute('data-chegada'), min=minEsp(iso);
    el.innerHTML='<i class="bi bi-clock"></i> '+fmtEsp(iso);
    el.classList.toggle('longo', min>30);
  });
  _atualizarEspera();
}
function _atualizarContadores() {
  var tot=0,esp=0,aten=0,falt=0;
  AG.dados.forEach(function(a){
    if(a.is_bloqueado||a.is_encaixe) return; tot++;
    if(a.status==='AGUARDANDO'||a.status==='EM_ATENDIMENTO') esp++;
    if(a.status==='ATENDIDO') aten++;
    if(a.status==='FALTA'||a.status==='CANCELADO') falt++;
  });
  document.getElementById('agCntEspera').textContent  = esp;
  document.getElementById('agCntAtendido').textContent = aten;
  document.getElementById('agCntFaltas').textContent   = falt;
  document.getElementById('agCntTotal').textContent    = tot;
}
function _atualizarEspera() {
  var lista=AG.dados.filter(function(a){
    return (a.status==='AGUARDANDO'||a.status==='EM_ATENDIMENTO')&&a.hora_chegada&&!a.is_bloqueado;
  }).sort(function(a,b){ return new Date(a.hora_chegada)-new Date(b.hora_chegada); });
  var el=document.getElementById('agListaEspera');
  if(!lista.length){ el.innerHTML='<p class="text-muted small text-center mb-0">Nenhum aguardando</p>'; return; }
  el.innerHTML=lista.map(function(a){
    var min=minEsp(a.hora_chegada), cor=min>30?'danger':'warning';
    return '<div class="espera-item">'
      +'<div><div class="fw-bold">'+esc(a.paciente_nome||'')+'</div>'
        +'<div class="text-muted" style="font-size:.7rem">'+a.hora_agenda
          +(a.is_encaixe?' <span class="badge bg-primary" style="font-size:.58rem">ENC</span>':'')+'</div></div>'
      +'<span class="badge bg-'+cor+(cor==='warning'?' text-dark':'')+'">'
        +'<i class="bi bi-clock"></i> '+fmtEsp(a.hora_chegada)+'</span>'
      +'</div>';
  }).join('');
}

async function agConfirmarAg() {

  // Se não tem paciente cadastrado, exige 1ª consulta marcada

    modalidade:        document.querySelector('input[name="agMod"]:checked').value,

    primeira_consulta: document.getElementById('agPrimeira').checked,
    telefone_whatsapp: document.getElementById('agTelefone').value,

    observacao:        document.getElementById('agObs').value,
    is_encaixe:  false,

  });

}

// ── Busca de paciente (autocomplete) ─────────────────────────────
async function agOnBuscaPac(v) {
  if(AG.buscaTmr) clearTimeout(AG.buscaTmr);
  var dd=document.getElementById('agDropdownBusca');
  if(v.length<3){ dd.style.display='none'; return; }
  AG.buscaTmr=setTimeout(async function(){
    var pacs = await api({action:'buscar_pacientes', termo:v});
    if(!pacs||!pacs.length) {
      dd.innerHTML='<div class="dbi text-muted">'
        +'<i class="bi bi-person-x-fill text-danger"></i> Paciente não encontrado no cadastro.<br>'
        +'<small>Marque como <strong>Primeira Consulta (1ª Vez)</strong>.</small></div>';
      document.getElementById('agPrimeira').checked = true;
    } else {
      dd.innerHTML=pacs.map(function(p){
        var tel=p.Celular||p.Telefone||'';
        return '<div class="dbi" onclick="_agSelecionarPac('+JSON.stringify(p).replace(/"/g,"'")+')">'+
          '<strong>'+esc(p.Nome)+'</strong>'+(p.Documento?' <span class="text-muted small">'+esc(p.Documento)+'</span>':'')+
          (tel?'<br><small class="text-success"><i class="bi bi-whatsapp"></i> '+esc(tel)+'</small>':'')+
          '</div>';
      }).join('');
    }
    dd.style.display='block';
  }, 380);
}
window.agOnBuscaPac = agOnBuscaPac;

window._agSelecionarPac = function(p) {
  if(typeof p==='string') try{ p=JSON.parse(p.replace(/'/g,'"')); }catch(e){return;}
  var tel=p.Celular||p.Telefone||'';
  document.getElementById('agBuscaPac').value  = p.Nome||'';
  document.getElementById('agPacId').value     = p.pcod||'';
  document.getElementById('agPacTel').value    = tel;
  document.getElementById('agTelefone').value  = tel;
  document.getElementById('agTagNome').textContent = p.Nome||'';
  document.getElementById('agTagDoc').textContent  = p.Documento||'';
  document.getElementById('agInfoPac').classList.remove('d-none');
  document.getElementById('agDropdownBusca').style.display='none';
  document.getElementById('agPrimeira').checked = false; // paciente cadastrado → não é 1ª vez por default
};
